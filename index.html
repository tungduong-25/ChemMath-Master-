/* Chấm điểm: Trả lời ngắn chấp nhận dấu phẩy/chấm, phân số & sai số làm tròn hợp lệ */
const parseNum = (s) => {
  if (s == null) return NaN;
  const t = String(s).trim().replace(/\s+/g, '').replace(/−/g, '-').replace(/,/g, '.');
  if (/^[-+]?\d+(\.\d+)?\/[-+]?\d+(\.\d+)?$/.test(t)) { const [a, b] = t.split('/'); return parseFloat(a) / parseFloat(b); }
  if (/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return parseFloat(t);
  return NaN;
};
const checkShort = (q, ans) => {
  if (ans == null || !String(ans).trim()) return false;
  const norm = (x) => String(x).trim().toLowerCase().replace(/\s+/g, '').replace(/,/g, '.').replace(/−/g, '-');
  const list = [q.correctAnswer, ...(q.acceptedAnswers || [])].filter((x) => x != null);
  if (list.some((x) => norm(x) === norm(ans))) return true;
  const v = parseNum(ans);
  if (isNaN(v)) return false;
  return list.some((x) => {
    const c = parseNum(x);
    if (isNaN(c)) return false;
    const sx = norm(x);
    let tol = 1e-9;
    if (sx.includes('/')) tol = 0.005;
    else if (sx.includes('.')) tol = 0.5 * Math.pow(10, -sx.split('.')[1].length) + 1e-9;
    return Math.abs(v - c) <= tol;
  });
};

    const score = st.length === 4 ? TF_TABLE[n] : (st.length ? n / st.length : 0);
    return { score, correct: n === st.length && st.length > 0, nCorrect: n, answered: answered > 0 };
  }
  if (q.type === 'short') { const ok = checkShort(q, ans); return { score: ok ? 1 : 0, correct: ok, answered: ans != null && String(ans).trim() !== '' }; }
  const ok = ans === q.correctAnswer;
  return { score: ok ? 1 : 0, correct: ok, answered: !!ans };
};

/* ============================== 2. BỘ DỰNG CÔNG THỨC MathChemText ============================== */
const escapeHtml = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/** Khôi phục ký tự thoát bị JSON "nuốt" (\t, \f, \r, \b, \v), đổi \( \) \[ \] sang $, tự đóng $ lẻ */
function repairLatexString(input) {
  if (input == null) return '';
  let s = String(input);
  s = s.replace(/\t/g, '\\t').replace(/\f/g, '\\f').replace(/\x08/g, '\\b').replace(/\v/g, '\\v').replace(/\r(?=[a-zA-Z])/g, '\\r').replace(/\r/g, '');
  s = s.replace(/\\\[([\s\S]+?)\\\]/g, (m, a) => '$$' + a + '$$');
  s = s.replace(/\\\(([\s\S]+?)\\\)/g, (m, a) => '$' + a + '$');
  const dd = (s.match(/\$\$/g) || []).length;
  if (dd % 2 === 1) s += '$$';
  const single = (s.replace(/\\\$/g, '').replace(/\$\$/g, '').match(/\$/g) || []).length;
  if (single % 2 === 1) s += '$';
  return s;
}
/* \n bị nuốt trong \nu, \neq, \nabla, \neg ... (chỉ sửa bên trong vùng công thức) */
const fixSwallowedNewline = (latex) => latex.replace(/\n(?=(?:u|eq|abla|eg|ot|ewline|e|i)(?![a-zA-Z]))/g, '\\n').replace(/\n/g, ' ');

/** Bộ chuyển đổi HTML dự phòng: hiển thị đẹp ngay cả khi KaTeX lỗi / chưa tải */
function formatChemMathFallback(raw) {
  if (!raw) return '';
  let s = escapeHtml(raw);
  s = s.replace(/\\ce\{([^{}]*)\}/g, (m, a) => a.replace(/&lt;=&gt;/g, ' ⇌ ').replace(/-&gt;/g, ' → ').replace(/([A-Za-z)\]])(\d+)/g, '$1<sub>$2</sub>'));
  s = s.replace(/\\(?:text|mathrm|mathbf|textbf|operatorname)\{([^{}]*)\}/g, '$1');
  s = s.replace(/\\tilde\{\\nu\}/g, 'ν̃');
  s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)').replace(/\\dfrac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)');
  s = s.replace(/\\sqrt\{([^{}]*)\}/g, '√($1)');
  const map = { '\\rightleftharpoons': '⇌', '\\longrightarrow': '⟶', '\\rightarrow': '→', '\\Rightarrow': '⇒', '\\Leftrightarrow': '⇔', '\\leftarrow': '←', '\\to': '→', '\\approx': '≈', '\\cdot': '·', '\\times': '×', '\\pm': '±', '\\leq': '≤', '\\geq': '≥', '\\le': '≤', '\\ge': '≥', '\\neq': '≠', '\\ne': '≠', '\\infty': '∞', '\\Delta': 'Δ', '\\delta': 'δ', '\\circ': '°', '\\pi': 'π', '\\alpha': 'α', '\\beta': 'β', '\\gamma': 'γ', '\\omega': 'ω', '\\varphi': 'φ', '\\phi': 'φ', '\\lambda': 'λ', '\\mu': 'μ', '\\nu': 'ν', '\\theta': 'θ', '\\sigma': 'σ', '\\sum': '∑', '\\int': '∫', '\\lim': 'lim', '\\sin': 'sin', '\\cos': 'cos', '\\tan': 'tan', '\\cot': 'cot', '\\ln': 'ln', '\\log': 'log', '\\in': '∈', '\\forall': '∀', '\\exists': '∃', '\\quad': '  ', '\\qquad': '    ', '\\left': '', '\\right': '', '\\displaystyle': '', '\\,': ' ', '\\;': ' ', '\\!': '' };
  Object.keys(map).sort((a, b) => b.length - a.length).forEach((k) => { s = s.split(k).join(map[k]); });
  s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>').replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>');
  s = s.replace(/\^([0-9+\-]+|\S)/g, '<sup>$1</sup>').replace(/_([0-9a-zA-Z])/g, '<sub>$1</sub>');
  s = s.replace(/\\[a-zA-Z]+/g, '').replace(/[{}]/g, '');
  return `<span class="fallback-math font-medium">${s}</span>`;
}

const KATEX_CACHE = new Map();
function renderMath(latex, display) {
  const key = (display ? 'D|' : 'I|') + latex;
  if (KATEX_CACHE.has(key)) return KATEX_CACHE.get(key);
  let html = null;
  if (window.katex) {
    try {
      html = window.katex.renderToString(latex, { displayMode: display, throwOnError: false, strict: 'ignore', trust: false, output: 'html' });
      if (html.includes('katex-error')) html = null;
    } catch (e) { html = null; }
  }
  if (!html) html = formatChemMathFallback(latex);
  if (window.katex) KATEX_CACHE.set(key, html);
  return html;
}
const formatInlineText = (t) => escapeHtml(t)
  .replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold text-ink">$1</strong>')
  .replace(/`([^`]+)`/g, '<code class="px-1 rounded bg-ink/10 font-mono text-[.88em]">$1</code>');

function buildMathHtml(text) {
  let s = repairLatexString(text);
  s = s.replace(/[ \t]*\n?[ \t]*(\$\$[\s\S]+?\$\$)[ \t]*\n?/g, '\u0000$1\u0000');
  return s.split(/(\$\$[\s\S]+?\$\$|\$[^$]+?\$)/g).map((p) => {
    if (!p) return '';
    if (p.length >= 4 && p.startsWith('$$') && p.endsWith('$$')) return `<span class="math-block">${renderMath(fixSwallowedNewline(p.slice(2, -2).trim()), true)}</span>`;
    if (p.length >= 2 && p.startsWith('$') && p.endsWith('$')) return renderMath(fixSwallowedNewline(p.slice(1, -1).trim()), false);
    return formatInlineText(p.replace(/\u0000/g, ''));
  }).join('');
}

function MathChemText({ text, block = false, className = '' }) {
  const html = useMemo(() => buildMathHtml(text), [text]);
  const Tag = block ? 'div' : 'span';
  return <Tag className={`mct whitespace-pre-line ${className}`} dangerouslySetInnerHTML={{ __html: html }} />;
}

/** Hiển thị câu trả lời Markdown + LaTeX của AI */
function RichAnswer({ text }) {
  const blocks = useMemo(() => {
    let s = repairLatexString(text || '');
    s = s.replace(/\$\$([\s\S]+?)\$\$/g, (m, a) => '$$' + a.replace(/\n+/g, ' ') + '$$');
    const lines = s.split('\n');
    const out = [];
    let table = null;
    lines.forEach((ln) => {
      const t = ln.trim();
      if (/^\|.*\|$/.test(t)) {
        if (/^\|[\s:\-|]+\|$/.test(t)) return;
        const cells = t.slice(1, -1).split('|').map((c) => c.trim());
        if (!table) { table = { k: 'table', rows: [] }; out.push(table); }
        table.rows.push(cells);
        return;
      }
      table = null;
      let m;
      if (!t) out.push({ k: 'gap' });
      else if ((m = t.match(/^(#{1,4})\s+(.*)$/))) out.push({ k: 'h', level: m[1].length, text: m[2] });
      else if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) out.push({ k: 'hr' });
      else if ((m = t.match(/^[-*•]\s+(.*)$/))) out.push({ k: 'li', text: m[1] });
      else if ((m = t.match(/^(\d+)[.)]\s+(.*)$/))) out.push({ k: 'ol', n: m[1], text: m[2] });
      else if ((m = t.match(/^>\s?(.*)$/))) out.push({ k: 'quote', text: m[1] });
      else out.push({ k: 'p', text: t });
    });
    return out;
  }, [text]);
  return (
    <div className="rich space-y-1.5 text-[0.95rem] leading-relaxed text-ink/90">
      {blocks.map((b, i) => {
        if (b.k === 'gap') return <div key={i} className="h-1" />;
        if (b.k === 'hr') return <hr key={i} className="border-ink/10 my-3" />;
        if (b.k === 'h') return (
          <div key={i} className={`font-display font-bold text-ink pt-3 ${b.level <= 2 ? 'text-lg' : 'text-base'} flex items-start gap-2`}>
            <span className="mt-2 w-1.5 h-1.5 rounded-full bg-accent shrink-0" /><MathChemText text={b.text} />
          </div>);
        if (b.k === 'li') return <div key={i} className="flex gap-2 pl-1"><span className="text-accent mt-0.5">▸</span><MathChemText text={b.text} className="flex-1 min-w-0" /></div>;
        if (b.k === 'ol') return <div key={i} className="flex gap-2 pl-1"><span className="font-mono text-accent font-bold min-w-[1.4rem]">{b.n}.</span><MathChemText text={b.text} className="flex-1 min-w-0" /></div>;
        if (b.k === 'quote') return <div key={i} className="border-l-4 border-accent/60 bg-accent/5 rounded-r-xl px-3 py-2"><MathChemText text={b.text} /></div>;
        if (b.k === 'table') return (
          <div key={i} className="overflow-x-auto my-2 rounded-xl border border-ink/10">
            <table className="w-full text-sm">
              <tbody>{b.rows.map((r, ri) => (
                <tr key={ri} className={ri === 0 ? 'bg-accent/10 font-semibold' : 'border-t border-ink/10'}>
                  {r.map((c, ci) => <td key={ci} className="px-3 py-2 align-top"><MathChemText text={c} /></td>)}
                </tr>))}
              </tbody>
            </table>
          </div>);
        return <MathChemText key={i} text={b.text} block />;
      })}
    </div>
  );
}

const GEMINI_SYSTEM_INSTRUCTION = R`Bạn là "ChemMath AI Master" — giáo viên chuyên Hóa học và Toán học THPT Việt Nam (chương trình GDPT 2018), chuyên bồi dưỡng học sinh giỏi. Luôn trả lời bằng tiếng Việt, trình bày Markdown rõ ràng, mọi công thức viết bằng LaTeX đặt trong $...$ (nội dòng) hoặc $$...$$ (dòng riêng). Công thức hóa học viết dạng \text{...} với chỉ số _ và ^ (ví dụ $\text{Fe}_2(\text{SO}_4)_3$, $\text{SO}_4^{2-}$).

/** Sửa chuỗi JSON thô của AI: giữ \\, \", \uXXXX; đổi \text, \frac, \beta, \rightarrow, \nu ... thành \\ trước khi JSON.parse */
function repairJsonEscapes(raw) {
  let out = '';
  for (let i = 0; i < raw.length; i++) {
    const c = raw[i];
    if (c !== '\\') { out += c; continue; }
    const n = raw[i + 1];
    if (n === undefined) { out += '\\\\'; continue; }
    if (n === '\\') { out += '\\\\'; i++; continue; }
    if (n === '"' || n === '/') { out += c + n; i++; continue; }
    if (n === 'u' && /^[0-9a-fA-F]{4}$/.test(raw.substr(i + 2, 4))) { out += c + n; i++; continue; }
    if ('tfbr'.includes(n) && /[a-zA-Z]/.test(raw[i + 2] || '')) { out += '\\\\'; continue; }
    if (n === 'n' && /^n(?:u|eq|abla|eg|ot|ewline|e|i)(?![a-zA-Z])/.test(raw.slice(i + 1, i + 9))) { out += '\\\\'; continue; }
    if ('bfnrt'.includes(n)) { out += c + n; i++; continue; }
    out += '\\\\';
  }
  return out;
}
function parseAIJson(text) {
  let t = String(text || '').trim().replace(/^```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  const s = t.search(/[\[{]/);
  const e = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}'));
  if (s >= 0 && e > s) t = t.slice(s, e + 1);
  try { return JSON.parse(repairJsonEscapes(t)); } catch (e1) {
    try { return JSON.parse(t); } catch (e2) { throw new Error('Không đọc được dữ liệu JSON do AI trả về.'); }
  }
}

const Cloud = {
  client: null,
  tried: false,
  init() {
    if (this.client || this.tried) return this.client;
    this.tried = true;
    if (window.supabase && window.supabase.createClient && isConfigured(APP_CONFIG.SUPABASE_URL) && isConfigured(APP_CONFIG.SUPABASE_ANON_KEY)) {
      try { this.client = window.supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY); } catch (e) { this.client = null; }
    }
    return this.client;
  },
  ready() { return !!this.init(); },
  async signInGoogle() {
    return this.client.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } });
  },
  async signOut() { try { await this.client.auth.signOut(); } catch (e) { /* ignore */ } },
  async push(user, row) {
    if (!this.ready() || !user || user.provider !== 'supabase') return false;
    const { error } = await this.client.from('chemmath_progress').upsert({ user_id: user.id, email: user.email, display_name: user.name, avatar_url: user.avatar, ...row, updated_at: new Date().toISOString() });
    return !error;
  },
  async pull(user) {
    if (!this.ready() || !user || user.provider !== 'supabase') return null;
    const { data } = await this.client.from('chemmath_progress').select('*').eq('user_id', user.id).maybeSingle();
    return data || null;
  },
  async leaderboard() {
    if (!this.ready()) return null;
    const { data, error } = await this.client.from('chemmath_progress').select('user_id,display_name,avatar_url,xp,streak,rank,avg_score').order('xp', { ascending: false }).limit(30);
    return error ? null : data;
  },
  subscribe(cb) {
    if (!this.ready()) return () => {};
    const ch = this.client.channel('chemmath-lb').on('postgres_changes', { event: '*', schema: 'public', table: 'chemmath_progress' }, cb).subscribe();
    return () => { try { this.client.removeChannel(ch); } catch (e) { /* ignore */ } };
  }
};

const GoogleGIS = {
  loading: null,
  ready: () => isConfigured(APP_CONFIG.GOOGLE_OAUTH_CLIENT_ID),
  load() {
    if (window.google && window.google.accounts) return Promise.resolve();
    if (this.loading) return this.loading;
    this.loading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => resolve(); s.onerror = () => reject(new Error('Không tải được Google Identity Services'));
      document.head.appendChild(s);
    });
    return this.loading;
  },
  async signIn() {
    await this.load();
    return new Promise((resolve, reject) => {
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: APP_CONFIG.GOOGLE_OAUTH_CLIENT_ID,
        scope: 'openid email profile',
        callback: async (resp) => {
          if (!resp || !resp.access_token) { reject(new Error('Đăng nhập Google bị hủy')); return; }
          try {
            const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${resp.access_token}` } });
            const p = await r.json();
            resolve({ id: p.sub, name: p.name || p.email, email: p.email, avatar: p.picture, provider: 'google' });
          } catch (e) { reject(e); }
        }
      });
      client.requestAccessToken();
    });
  }
};

const Webhooks = {
  async post(url, payload) {
    await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    return true;
  },
  async sendReport({ subject, html, text, to }) {
    const receiver = to || APP_CONFIG.DEFAULT_RECEIVER_GMAIL;
    if (isConfigured(APP_CONFIG.GMAIL_REPORT_WEBHOOK_URL)) {
      await this.post(APP_CONFIG.GMAIL_REPORT_WEBHOOK_URL, { to: receiver, subject, html, text, app: APP_CONFIG.AUTHOR_INFO.projectName });
      return 'webhook';
    }
    const body = encodeURIComponent(text.slice(0, 1800));
    window.open(`mailto:${receiver}?subject=${encodeURIComponent(subject)}&body=${body}`, '_blank');
    return 'mailto';
  },
  async syncSheets(payload) {
    if (!isConfigured(APP_CONFIG.GOOGLE_SHEETS_SYNC_WEBHOOK_URL)) return false;
    try { await this.post(APP_CONFIG.GOOGLE_SHEETS_SYNC_WEBHOOK_URL, payload); return true; } catch (e) { return false; }
  }
};

const downloadFile = (name, content, mime = 'application/json') => {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
};

  /* ---------- Nhiệt động hóa học & Tốc độ phản ứng ---------- */
  {
    id: 'CHEM-THERMO-01', subject: 'chem', topic: 'thermo', level: 'Vận dụng cao', type: 'short',
    question: R`Xăng sinh học E5 chứa $5\%$ thể tích ethanol ($D_1 = 0,80\text{ g/mL}$, $M_1 = 46$, nhiệt đốt cháy $Q_1 = 1367\text{ kJ/mol}$) và $95\%$ thể tích octane ($D_2 = 0,70\text{ g/mL}$, $M_2 = 114$, $Q_2 = 5470\text{ kJ/mol}$). Tính tổng nhiệt lượng (MJ) tỏa ra khi đốt cháy hoàn toàn $1,0\text{ L}$ xăng E5 (không làm tròn số mol trung gian; làm tròn kết quả cuối đến $1$ chữ số thập phân).`,
    correctAnswer: '33.1', acceptedAnswers: ['33,1'],
    knowledgeGroup: 'Nhiệt hóa học & Quy tắc không làm tròn số trung gian',
    trapWarning: R`Bẫy làm tròn sớm: nếu lấy $n_\text{ethanol} \approx 0,87$ và $n_\text{octane} \approx 5,83$ rồi mới nhân, sai số sẽ dồn vào kết quả. Phải giữ nguyên $\frac{40}{46}$ và $\frac{665}{114}$.`,
    hint: R`$m_\text{ethanol} = 50 \cdot 0,8 = 40\text{ g}$; $m_\text{octane} = 950 \cdot 0,7 = 665\text{ g}$. Giữ nguyên phân số $\frac{40}{46}$ và $\frac{665}{114}$ khi nhân với nhiệt đốt cháy.`,
    explanation: R`Bước 1: $V_1 = 50\text{ mL} \Rightarrow m_1 = 40\text{ g}$; $V_2 = 950\text{ mL} \Rightarrow m_2 = 665\text{ g}$.
Bước 2 – Giữ nguyên phân số:
$$n_{\text{C}_2\text{H}_5\text{OH}} = \frac{40}{46}\text{ mol}, \quad n_{\text{C}_8\text{H}_{18}} = \frac{665}{114}\text{ mol}$$
Bước 3 – Tổng nhiệt lượng:
$$Q = \frac{40}{46} \cdot 1367 + \frac{665}{114} \cdot 5470 = \frac{20}{23} \cdot 1367 + \frac{35}{6} \cdot 5470 \approx 33097\text{ kJ}$$
Chỉ làm tròn ở bước cuối: $Q \approx 33,1\text{ MJ}$.`
  },
  {
    id: 'CHEM-THERMO-02', subject: 'chem', topic: 'thermo', level: 'Nhận biết', type: 'mcq',
    question: R`Một phản ứng hóa học có biến thiên enthalpy chuẩn $\Delta_r H^\circ_{298} < 0$. Phản ứng đó là`,
    options: [R`phản ứng thu nhiệt`, R`phản ứng tỏa nhiệt`, R`phản ứng không trao đổi nhiệt`, R`phản ứng chỉ xảy ra khi đun nóng liên tục`],
    correctAnswer: 'B',
    knowledgeGroup: 'Dấu của biến thiên enthalpy',
    trapWarning: R`$\Delta_r H < 0$: hệ mất nhiệt ra môi trường ⇒ TỎA nhiệt. Đừng nhầm với "nhiệt lượng tỏa ra $Q > 0$".`,
    hint: R`$\Delta H = H_\text{sản phẩm} - H_\text{chất đầu}$. Âm nghĩa là sản phẩm có năng lượng thấp hơn.`,
    explanation: R`$\Delta_r H^\circ_{298} < 0$ ⇒ năng lượng của hệ giảm, nhiệt được giải phóng ra môi trường ⇒ phản ứng tỏa nhiệt. Đáp án B.`
  },
  {
    id: 'CHEM-THERMO-03', subject: 'chem', topic: 'thermo', level: 'Thông hiểu', type: 'short',
    question: R`Cho enthalpy tạo thành chuẩn ($\text{kJ/mol}$): $\Delta_f H^\circ_{298}(\text{CH}_4, g) = -74,8$; $\Delta_f H^\circ_{298}(\text{CO}_2, g) = -393,5$; $\Delta_f H^\circ_{298}(\text{H}_2\text{O}, l) = -285,8$. Tính $\Delta_r H^\circ_{298}$ (kJ) của phản ứng $\text{CH}_4(g) + 2\text{O}_2(g) \rightarrow \text{CO}_2(g) + 2\text{H}_2\text{O}(l)$.`,
    correctAnswer: '-890.3', acceptedAnswers: ['-890,3'],
    knowledgeGroup: 'Tính biến thiên enthalpy theo enthalpy tạo thành',
    trapWarning: R`Bẫy chiều trừ: $\Delta_r H = \sum \Delta_f H(\text{sản phẩm}) - \sum \Delta_f H(\text{chất đầu})$. Bẫy hệ số: nhân $2$ cho $\text{H}_2\text{O}$. $\Delta_f H^\circ$ của đơn chất bền $\text{O}_2$ bằng $0$.`,
    hint: R`Sản phẩm trừ chất đầu, nhớ nhân hệ số tỉ lượng.`,
    explanation: R`$$\Delta_r H^\circ_{298} = [-393,5 + 2(-285,8)] - [-74,8 + 2 \cdot 0] = -965,1 + 74,8 = -890,3\text{ kJ}$$`
  },
  {
    id: 'CHEM-THERMO-04', subject: 'chem', topic: 'thermo', level: 'Vận dụng thấp', type: 'mcq',
    question: R`Cho năng lượng liên kết ($\text{kJ/mol}$): $E_{\text{H-H}} = 436$; $E_{\text{Cl-Cl}} = 243$; $E_{\text{H-Cl}} = 432$. Biến thiên enthalpy của phản ứng $\text{H}_2(g) + \text{Cl}_2(g) \rightarrow 2\text{HCl}(g)$ là`,
    options: [R`$-185\text{ kJ}$`, R`$+185\text{ kJ}$`, R`$-247\text{ kJ}$`, R`$-92,5\text{ kJ}$`],

    knowledgeGroup: 'Tính biến thiên enthalpy theo năng lượng liên kết',
    trapWarning: R`Theo năng lượng liên kết thì ngược chiều: $\Delta_r H = \sum E_b(\text{chất đầu}) - \sum E_b(\text{sản phẩm})$. Đừng quên hệ số $2$ của HCl.`,
    hint: R`Phá liên kết (thu năng lượng) trừ đi tạo liên kết (tỏa năng lượng).`,
    explanation: R`$$\Delta_r H = (436 + 243) - 2 \cdot 432 = 679 - 864 = -185\text{ kJ}$$ Đáp án A.`
  },
  {
    id: 'CHEM-RATE-05', subject: 'chem', topic: 'thermo', level: 'Thông hiểu', type: 'short',
    question: R`Một phản ứng có hệ số nhiệt độ Van't Hoff $\gamma = 2$. Khi tăng nhiệt độ từ $20^\circ\text{C}$ lên $50^\circ\text{C}$ thì tốc độ phản ứng tăng lên bao nhiêu lần?`,
    correctAnswer: '8',
    knowledgeGroup: 'Quy tắc Van\'t Hoff về ảnh hưởng của nhiệt độ',
    trapWarning: R`Bẫy tuyến tính: tăng $30^\circ\text{C}$ không phải tăng $2 \cdot 3 = 6$ lần mà là $\gamma^{3} = 2^3 = 8$ lần.`,
    hint: R`$\frac{v_2}{v_1} = \gamma^{\frac{T_2 - T_1}{10}}$.`,
    explanation: R`$$\frac{v_2}{v_1} = 2^{\frac{50 - 20}{10}} = 2^3 = 8$$`
  },
  {
    id: 'CHEM-RATE-06', subject: 'chem', topic: 'thermo', level: 'Vận dụng cao', type: 'tf',
    question: R`Xét phản ứng đơn giản (một giai đoạn) $2\text{NO}(g) + \text{O}_2(g) \rightarrow 2\text{NO}_2(g)$, có $\Delta_r H^\circ_{298} = -114,2\text{ kJ}$. Biểu thức tốc độ $v = k[\text{NO}]^2[\text{O}_2]$. Xét tính Đúng / Sai:`,
    statements: [
      { id: 'a', text: R`Tăng nồng độ NO lên $2$ lần (giữ nguyên $[\text{O}_2]$) thì tốc độ phản ứng tăng $4$ lần.`, isTrue: true },
      { id: 'b', text: R`Tăng đồng thời nồng độ cả NO và $\text{O}_2$ lên $2$ lần thì tốc độ tăng $8$ lần.`, isTrue: true },
      { id: 'c', text: R`Enthalpy tạo thành chuẩn của $\text{O}_2(g)$ bằng $0$.`, isTrue: true },
      { id: 'd', text: R`Thêm chất xúc tác làm giá trị $\Delta_r H^\circ_{298}$ của phản ứng giảm đi.`, isTrue: false }

    knowledgeGroup: 'Định luật tác dụng khối lượng & Vai trò chất xúc tác',
    trapWarning: R`Chất xúc tác chỉ làm giảm năng lượng hoạt hóa $E_a$, KHÔNG làm thay đổi $\Delta_r H$ (hàm trạng thái).`,
    hint: R`Thay $[\text{NO}] \rightarrow 2[\text{NO}]$ vào biểu thức tốc độ: $(2)^2 = 4$.`,
