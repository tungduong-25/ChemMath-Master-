    // 3. BỘ DỰNG CÔNG THỨC MathChemText KHÔNG BAO GIỜ LỖI
    // ============================================================================
    function sanitizeLatexInput(raw) {
      if (raw === null || raw === undefined) return "";
      let str = String(raw);
      str = str
        .replace(/\t(?=[a-zA-Z])/g, "\\t")
        .replace(/\f(?=[a-zA-Z])/g, "\\f")
        .replace(/\r(?=[a-zA-Z])/g, "\\r")
        .replace(/\x08(?=[a-zA-Z])/g, "\\b");

      const withoutDouble = str.split("$$").join("");
      const singleCount = withoutDouble.split("$").length - 1;
      if (singleCount % 2 !== 0) {
        str += "$";
      }
      return str;
    }

    function fallbackHtmlFormat(text) {
      return text
        .replace(/\\text\{([^}]*)\}/g, "$1")
        .replace(/\\ce\{([^}]*)\}/g, "$1")
        .replace(/\\rightarrow/g, "→")
        .replace(/\\rightleftharpoons/g, "⇌")
        .replace(/\\approx/g, "≈")
        .replace(/\\Delta/g, "Δ")
        .replace(/\\times/g, "×")
        .replace(/\\cdot/g, "·")
        .replace(/\\circ/g, "°")
        .replace(/\\tilde\{\\nu\}/g, "ν̃")
        .replace(/_\{([^}]+)\}/g, "<sub>$1</sub>")
        .replace(/_([0-9a-zA-Z])/g, "<sub>$1</sub>")
        .replace(/\^\{([^}]+)\}/g, "<sup>$1</sup>")
        .replace(/\^([0-9a-zA-Z+\-°]+)/g, "<sup>$1</sup>");
    }

    function MathChemText({ content, className = "", block = false }) {
      const renderedHtml = useMemo(() => {
        const clean = sanitizeLatexInput(content);
        if (!clean) return "";

        const tokenRegex = /(\$\$[\s\S]+?\$\$|\$[^$]+?\$)/g;
        const parts = clean.split(tokenRegex);

        return parts
          .map((part) => {
            if (!part) return "";
            const isDisplay = part.startsWith("$$") && part.endsWith("$$");
            const isInline = !isDisplay && part.startsWith("$") && part.endsWith("$");

            if (isDisplay || isInline) {
              const mathExpr = isDisplay ? part.slice(2, -2).trim() : part.slice(1, -1).trim();
              if (window.katex && typeof window.katex.renderToString === "function") {
                try {
                  return window.katex.renderToString(mathExpr, {
                    displayMode: isDisplay || block,
                    throwOnError: false,
                    strict: false,
                    trust: true
                  });
                } catch (e) {
                  return '<span class="font-mono text-amber-300">' + fallbackHtmlFormat(mathExpr) + "</span>";
                }
              }
              return '<span class="font-mono">' + fallbackHtmlFormat(mathExpr) + "</span>";
            }

            return part
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
              .replace(/\n/g, "<br/>");
          })
          .join("");
      }, [content, block]);

      return (
        <span
          className={"selectable-text break-words leading-relaxed " + className}
          dangerouslySetInnerHTML={{ __html: renderedHtml }}
        />
      );
    }

            trapNote: "Bẫy cộng trực tiếp $+17\\text{ đvC}$ mà quên trừ đi $1\\text{ đvC}$ của nguyên tử H bị thế!",

    function createMathQuestionItem(chapterIdx, localIdx, globalIdNum) {
      const chap = MATH_CHAPTERS[chapterIdx];
      // Chia đều 625 câu cho 4 mức độ: 157, 156, 156, 156
      const levelIdx = localIdx < 157 ? 0 : localIdx < 313 ? 1 : localIdx < 469 ? 2 : 3;
      const level = LEVELS_LIST[levelIdx];
      const typeCycle = localIdx % 5;
      const qType = typeCycle < 3 ? "mcq" : typeCycle === 3 ? "tf" : "short";
      const k = (localIdx % 120) + 1;
      const qId = formatQId(globalIdNum);

      // CHƯƠNG I: Lượng giác
      if (chapterIdx === 0) {
        const amp = (k % 9) + 2;
        const shift = (k % 5) + 1;
        const maxVal = amp + shift;
        const minVal = -amp + shift;
        return {
          id: qId,
          subject: "math",
          chapterId: chap.id,
          topic: chap.name,
          level,
          type: qType === "short" ? "short" : "mcq",
          question: "Tìm giá trị lớn nhất $M$ của hàm số lượng giác $y = " + amp + "\\sin\\left(2x - \\frac{\\pi}{3}\\right) + " + shift + "$ trên tập số thực $\\mathbb{R}$.",
          options: [
            "A. $M = " + maxVal + "$",
            "B. $M = " + minVal + "$",
            "C. $M = " + amp + "$",
            "D. $M = " + (2 * amp + shift) + "$"
          ],
          correctAnswer: qType === "short" ? String(maxVal) : "A",
          hint: "Sử dụng tập giá trị của hàm sin: $-1 \\le \\sin\\left(2x - \\frac{\\pi}{3}\\right) \\le 1 \\quad \\forall x \\in \\mathbb{R}$.",
          trapNote: "Bẫy nhân hệ số 2 bên trong cung lượng giác ra ngoài biên độ.",
          explanation: "Vì $-1 \\le \\sin\\left(2x - \\frac{\\pi}{3}\\right) \\le 1, \\forall x \\in \\mathbb{R}$, nên: $$" + minVal + " \\le " + amp + "\\sin\\left(2x - \\frac{\\pi}{3}\\right) + " + shift + " \\le " + maxVal + "$$ Vậy giá trị lớn nhất của hàm số là $M = " + maxVal + "$."
        };
      }

      // CHƯƠNG II: Dãy số, Cấp số cộng & Cấp số nhân
      if (chapterIdx === 1) {
        const u1 = (k % 7) + 2;
        const d = (k % 5) + 2;
        const nTerms = 10 + (k % 11);
        const sumSn = (nTerms * (2 * u1 + (nTerms - 1) * d)) / 2;
        return {
          id: qId,
          subject: "math",
          chapterId: chap.id,
          topic: chap.name,
          level,
          type: qType === "short" ? "short" : "mcq",
          question: "Cho cấp số cộng $(u_n)$ có số hạng đầu $u_1 = " + u1 + "$ và công sai $d = " + d + "$. Tính tổng $S_{" + nTerms + "}$ của $" + nTerms + "$ số hạng đầu tiên của cấp số cộng này.",
          options: [
            "A. $S_{" + nTerms + "} = " + sumSn + "$",
            "B. $S_{" + nTerms + "} = " + (sumSn + nTerms) + "$",
            "C. $S_{" + nTerms + "} = " + (u1 + (nTerms - 1) * d) + "$",
            "D. $S_{" + nTerms + "} = " + (sumSn * 2) + "$"
          ],
          correctAnswer: qType === "short" ? String(sumSn) : "A",
          hint: "Áp dụng công thức tổng cấp số cộng: $S_n = \\frac{n[2u_1 + (n-1)d]}{2}$.",
          trapNote: "Bẫy tính nhầm số hạng tổng quát $u_n$ thay vì tổng $S_n$.",
          explanation: "Áp dụng công thức tổng $" + nTerms + "$ số hạng đầu của cấp số cộng: $$S_{" + nTerms + "} = \\frac{" + nTerms + " \\times [2 \\times " + u1 + " + (" + nTerms + " - 1) \\times " + d + "]}{2} = " + sumSn + "$$"
        };
      }

      // CHƯƠNG III: Giới hạn & Hàm số liên tục
      if (chapterIdx === 2) {
        const aCoef = (k % 6) + 2;
        const bCoef = (k % 5) + 1;
        const x0 = (k % 4) + 1;
        const limVal = aCoef * x0 * x0 + bCoef * x0;
        return {
          id: qId,
          subject: "math",
          chapterId: chap.id,
          topic: chap.name,
          level,
          type: qType === "short" ? "short" : "mcq",
          question: "Tính giới hạn hữu hạn của hàm số: $$L = \\lim_{x \\to " + x0 + "} \\left(" + aCoef + "x^2 + " + bCoef + "x\\right)$$",
          options: [
            "A. $L = " + limVal + "$",
            "B. $L = " + (limVal + aCoef) + "$",
            "C. $L = " + (2 * aCoef * x0 + bCoef) + "$",
            "D. $L = " + (aCoef + bCoef) + "$"
          ],
          correctAnswer: qType === "short" ? String(limVal) : "A",
          hint: "Hàm đa thức liên tục trên $\\mathbb{R}$ nên $\\lim_{x \\to x_0} P(x) = P(x_0)$.",
          trapNote: "Bẫy tính đạo hàm thay vì thay cận giới hạn.",
          explanation: "Thay trực tiếp $x = " + x0 + "$ vào đa thức liên tục: $$L = " + aCoef + " \\times " + x0 + "^2 + " + bCoef + " \\times " + x0 + " = " + limVal + "$$"
        };
      }

      // CHƯƠNG VI: Hàm số mũ & Lôgarit
      if (chapterIdx === 5) {
        const base = (k % 3) + 2; // 2, 3, 4
        const expVal = (k % 3) + 2; // 2, 3, 4
        const rhs = Math.pow(base, expVal);
        const shift = (k % 7) + 1;
        const rootX = rhs + shift;
        return {
          id: qId,
          subject: "math",
          chapterId: chap.id,
          topic: chap.name,
          level,
          type: qType === "short" ? "short" : "mcq",
          question: "Tìm nghiệm thực của phương trình lôgarit: $$\\log_{" + base + "}(x - " + shift + ") = " + expVal + "$$",
          options: [
            "A. $x = " + rootX + "$",
            "B. $x = " + (rhs - shift) + "$",
            "C. $x = " + (base * expVal + shift) + "$",
            "D. $x = " + rhs + "$"
          ],
          correctAnswer: qType === "short" ? String(rootX) : "A",
          hint: "Điều kiện $x > " + shift + "$. Mũ hóa cơ số $" + base + "$: $x - " + shift + " = " + base + "^{" + expVal + "}$.",
          trapNote: "Bẫy lấy $" + base + " \\times " + expVal + "$ thay vì lũy thừa $" + base + "^{" + expVal + "} = " + rhs + "$.",
          explanation: "Điều kiện xác định: $x > " + shift + "$. Phương trình tương đương: $$x - " + shift + " = " + base + "^{" + expVal + "} = " + rhs + " \\Leftrightarrow x = " + rootX + " \\quad (\\text{thỏa mãn})$$"
        };
      }

      // CHƯƠNG VII: Đạo hàm & Ứng dụng (bao gồm bài toán tốc độ phản ứng v(t) = C'(t) và cực trị hệ số góc tiếp tuyến)
      if (chapterIdx === 6) {
        const xVertex = (k % 5) + 1;
        const minSlope = (k % 7) + 2;
        const bParam = 3 * xVertex;
        const cParam = 3 * xVertex * xVertex + minSlope;
        return {
          id: qId,
          subject: "math",
          chapterId: chap.id,
          topic: chap.name,
          level,
          type: qType === "short" ? "short" : "mcq",
          question: "Cho hàm số bậc ba $y = f(x) = x^3 - " + bParam + "x^2 + " + cParam + "x - 5$. Tìm giá trị nhỏ nhất $k_{\\min}$ của hệ số góc tiếp tuyến của đồ thị hàm số đã cho.",
          options: [
            "A. $k_{\\min} = " + minSlope + "$",
            "B. $k_{\\min} = " + xVertex + "$",
            "C. $k_{\\min} = " + cParam + "$",
            "D. $k_{\\min} = " + (minSlope - 1) + "$"
          ],
          correctAnswer: qType === "short" ? String(minSlope) : "A",
          hint: "Hệ số góc tiếp tuyến tại hoành độ $x_0$ là $k = f'(x_0) = 3(x_0 - " + xVertex + ")^2 + " + minSlope + "$.",
          trapNote: "Bẫy trả lời hoành độ điểm uốn $x_0 = " + xVertex + "$ thay vì giá trị nhỏ nhất của $f'(x_0)$.",
          explanation: "Ta có đạo hàm: $$f'(x) = 3x^2 - " + (2 * bParam) + "x + " + cParam + " = 3(x - " + xVertex + ")^2 + " + minSlope + " \\ge " + minSlope + " \\quad \\forall x \\in \\mathbb{R}$$ Dấu bằng xảy ra khi $x = " + xVertex + "$. Vậy $k_{\\min} = " + minSlope + "$."
        };
      }

      // CHƯƠNG IV, V, VIII: Không gian, Xác suất Thống kê & Thể tích khối chóp/lăng trụ
      const baseArea = ((k % 6) + 2) * 3;
      const heightH = (k % 5) + 3;
      const volPyramid = (baseArea * heightH) / 3;
      return {
        id: qId,
        subject: "math",
        chapterId: chap.id,
        topic: chap.name,
        level,
        type: qType === "short" ? "short" : "mcq",
        question: "[" + chap.code + " - Câu #" + (localIdx + 1) + "] Cho hình chóp $S.ABC$ có diện tích mặt đáy $S_{\\triangle ABC} = " + baseArea + "\\text{ cm}^2$ và đường cao $SH = " + heightH + "\\text{ cm}$ vuông góc với mặt phẳng đáy $(ABC)$. Thể tích $V$ của khối chóp $S.ABC$ bằng bao nhiêu $\\text{cm}^3$?",
        options: [
          "A. $V = " + volPyramid + "\\text{ cm}^3$",
          "B. $V = " + (baseArea * heightH) + "\\text{ cm}^3$",
          "C. $V = " + (volPyramid * 2) + "\\text{ cm}^3$",
          "D. $V = " + (baseArea + heightH) + "\\text{ cm}^3$"
        ],
        correctAnswer: qType === "short" ? String(volPyramid) : "A",
        hint: "Áp dụng công thức thể tích khối chóp: $V = \\frac{1}{3} S_{\\text{đáy}} \\cdot h$.",
        trapNote: "Bẫy quên nhân hệ số $\\frac{1}{3}$ của khối chóp (nhầm với thể tích khối lăng trụ $V = B \\cdot h$).",
        explanation: "Từ nguyên lý thể tích khối chóp: $$V_{S.ABC} = \\frac{1}{3} \\cdot S_{\\triangle ABC} \\cdot SH = \\frac{1}{3} \\times " + baseArea + " \\times " + heightH + " = " + volPyramid + "\\text{ cm}^3$$"
      };
    }

    // 7. BIỂU ĐỒ SVG ĐỘNG: RADAR 6 TRỤC & AREA CHART TIẾN ĐỘ
    // ============================================================================
    function RadarChartSVG({ axes, accentColor = "#10b981" }) {
      const size = 290;
      const center = size / 2;
      const radius = 96;
      const levels = [0.25, 0.5, 0.75, 1.0];

      const getPoint = (index, ratio) => {
        const angle = (Math.PI * 2 * index) / axes.length - Math.PI / 2;
        const x = center + radius * ratio * Math.cos(angle);
        const y = center + radius * ratio * Math.sin(angle);
        return { x, y };
      };

      const polygonPoints = axes
        .map((axis, idx) => {
          const p = getPoint(idx, Math.max(0.04, Math.min(1, axis.value / 100)));
          return p.x + "," + p.y;
        })
        .join(" ");

      return (
        <svg viewBox={"0 0 " + size + " " + size} className="w-full max-w-[310px] mx-auto select-none overflow-visible">
          {levels.map((lvl, idx) => {
            const pts = axes
              .map((_, i) => {
                const p = getPoint(i, lvl);
                return p.x + "," + p.y;
              })
              .join(" ");
            return (
              <polygon
                key={idx}
                points={pts}
                fill="none"
                stroke="currentColor"
                strokeOpacity={0.18}
                strokeWidth="1"
              />
            );
          })}
          {axes.map((axis, idx) => {
            const end = getPoint(idx, 1);
            const labelPos = getPoint(idx, 1.25);
            return (
              <g key={idx}>
                <line
                  x1={center}
                  y1={center}
                  x2={end.x}
                  y2={end.y}
                  stroke="currentColor"
                  strokeOpacity={0.22}
                  strokeWidth="1"
                />
                <text
                  x={labelPos.x}
                  y={labelPos.y}
                  textAnchor="middle"
                  dominantBaseline="middle"
                  className="fill-current text-[9.5px] font-semibold opacity-85"
                >
                  {axis.shortLabel} ({axis.value}%)
                </text>
              </g>
            );
          })}
          <polygon
            points={polygonPoints}
            fill={accentColor}
            fillOpacity="0.28"
            stroke={accentColor}
            strokeWidth="2.4"
          />
          {axes.map((axis, idx) => {
            const p = getPoint(idx, Math.max(0.04, Math.min(1, axis.value / 100)));
            return (
              <circle
                key={idx}
                cx={p.x}
                cy={p.y}
                r="4"
                fill={accentColor}
                stroke="#0f172a"
                strokeWidth="1.5"
              />
            );
          })}
        </svg>
      );
    }

    function AreaChartSVG({ history, accentColor = "#06b6d4" }) {
      const width = 520;
      const height = 190;
      const padLeft = 36;
      const padRight = 18;
      const padTop = 20;
      const padBottom = 30;
      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      if (!history || history.length === 0) {
        return (
          <div className="h-48 flex flex-col items-center justify-center border border-dashed border-slate-700/70 rounded-2xl p-4 text-center">
            <i className="fa-solid fa-chart-line text-2xl opacity-40 mb-2"></i>
            <p className="text-xs font-bold opacity-80">Chưa có dữ liệu lịch sử điểm số (0 lượt làm bài)</p>
            <p className="text-[11px] opacity-60 mt-1">
              Hãy hoàn thành bài kiểm tra đầu tiên từ Kho 10.000 Câu Hỏi để hệ thống vẽ biểu đồ tiến độ thực tế.
            </p>
          </div>
        );
      }

      const data = history.slice(-8);
      const points = data.map((d, idx) => {
        const x = padLeft + (data.length === 1 ? plotW / 2 : (idx / (data.length - 1)) * plotW);
        const y = padTop + plotH - (Math.max(0, Math.min(10, d.score)) / 10) * plotH;
        return { x, y, ...d };
      });

      const linePath = points.map((p, i) => (i === 0 ? "M " : "L ") + p.x + " " + p.y).join(" ");
      const areaPath =
        linePath +
        " L " +
        points[points.length - 1].x +
        " " +
        (padTop + plotH) +
        " L " +
        points[0].x +
        " " +
        (padTop + plotH) +
        " Z";

      return (
        <svg viewBox={"0 0 " + width + " " + height} className="w-full h-48 overflow-visible select-none">
          <defs>
            <linearGradient id="scoreGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={accentColor} stopOpacity="0.45" />
              <stop offset="100%" stopColor={accentColor} stopOpacity="0.0" />
            </linearGradient>
          </defs>
          {[0, 2.5, 5, 7.5, 10].map((val, i) => {
            const y = padTop + plotH - (val / 10) * plotH;
            return (
              <g key={i}>
                <line
                  x1={padLeft}
                  y1={y}
                  x2={width - padRight}
                  y2={y}
                  stroke="currentColor"
                  strokeOpacity="0.12"
                  strokeDasharray="3 3"
                />
                <text x={padLeft - 8} y={y + 3} textAnchor="end" className="fill-current text-[10px] opacity-60">
                  {val}
                </text>
              </g>
            );
          })}
          {data.length > 1 && <path d={areaPath} fill="url(#scoreGrad)" />}
          <path d={linePath} fill="none" stroke={accentColor} strokeWidth="2.8" strokeLinecap="round" />
          {points.map((p, idx) => (
            <g key={idx}>
              <circle cx={p.x} cy={p.y} r="4.5" fill={accentColor} stroke="#0f172a" strokeWidth="1.5" />
              <text x={p.x} y={p.y - 9} textAnchor="middle" className="fill-current text-[10px] font-bold">
                {p.score}
              </text>
              <text x={p.x} y={height - 8} textAnchor="middle" className="fill-current text-[9.5px] opacity-70">
                {p.label}
              </text>
            </g>
          ))}
        </svg>
      );
    }

      // ========================================================================
      // STATE PHÒNG THI & RÚT NGẪU NHIÊN PHÂN TẦNG (STRATIFIED RANDOM SAMPLING)
      // ========================================================================
      const [quizFilterTopic, setQuizFilterTopic] = useState("ALL");
      const [quizFilterLevel, setQuizFilterLevel] = useState("ALL");
      const [quizCount, setQuizCount] = useState(10);
      const [quizSeed, setQuizSeed] = useState(1);
      const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [revealedHints, setRevealedHints] = useState({});

      const subjectChapters = useMemo(() => {
        return activeSubject === "chemistry" ? CHEMISTRY_CHAPTERS : MATH_CHAPTERS;
      }, [activeSubject]);

      // Rút ngẫu nhiên có phân tầng (Stratified Random Sampling) từ kho 10.000 câu hỏi
      const activeQuizQuestions = useMemo(() => {
        let pool = allQuestions.filter((q) => q.subject === activeSubject);
        if (quizFilterTopic !== "ALL") {
          pool = pool.filter((q) => q.topic === quizFilterTopic);
        }
        if (quizFilterLevel !== "ALL") {
          pool = pool.filter((q) => q.level === quizFilterLevel);
        }
        if (pool.length <= quizCount) return pool;

        // Phân tầng đều qua các chương/mức độ trong pool dựa trên quizSeed
        const selected = [];
        const step = Math.max(1, Math.floor(pool.length / quizCount));
        const offset = (quizSeed * 37) % step;
        for (let i = 0; i < quizCount; i++) {
          const idx = (i * step + offset) % pool.length;
          selected.push(pool[idx]);
        }
        return selected;
      }, [allQuestions, activeSubject, quizFilterTopic, quizFilterLevel, quizCount, quizSeed]);

      const isQuestionCorrect = (q, ans) => {
        if (!ans) return false;
        if (q.type === "mcq") {
          return ans === q.correctAnswer;
        }
        if (q.type === "short") {
          const normUser = String(ans).trim().replace(",", ".");
          const normTrue = String(q.correctAnswer).trim().replace(",", ".");
          return normUser === normTrue;
        }
        if (q.type === "tf") {
          return q.statements.every((st) => ans[st.id] === st.isTrue);
        }
        return false;
      };

      const handleSubmitQuiz = async () => {
        if (activeQuizQuestions.length === 0) return;
        let correctCount = 0;
        const newlyTrapped = [];
        const updatedTopicStats = { ...topicStats };

        activeQuizQuestions.forEach((q) => {
          const ok = isQuestionCorrect(q, userAnswers[q.id]);
          const prevStat = updatedTopicStats[q.topic] || { correct: 0, total: 0 };
          updatedTopicStats[q.topic] = {
            correct: prevStat.correct + (ok ? 1 : 0),
            total: prevStat.total + 1
          };

          if (ok) {
            correctCount += 1;
          } else {
            newlyTrapped.push({
              id: "TRAP_AUTO_" + q.id,
              subject: q.subject,
              title: "[" + q.id + "] Bẫy " + q.topic.split(":")[0],
              topic: q.topic,
              wrongHabit: q.trapNote || "Nhầm lẫn bước biến đổi hoặc hệ số cân bằng.",
              correctPrinciple: q.explanation,
              mastery: 25,
              nextReview: "Hôm nay"
            });
          }
        });

        setTopicStats(updatedTopicStats);

        const score10 = Number(((correctCount / activeQuizQuestions.length) * 10).toFixed(1));
        const newEntry = {
          label: "Đề #" + (quizHistory.length + 1),
          score: score10,
          subject: activeSubject,
          date: new Date().toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit" })
        };

        setQuizSubmitted(true);
        setQuizHistory((prev) => [...prev, newEntry]);

        if (newlyTrapped.length > 0) {
          setTraps((prev) => {
            const existingIds = new Set(prev.map((t) => t.id));
            const uniqueNew = newlyTrapped.filter((t) => !existingIds.has(t.id));
            return [...uniqueNew, ...prev];
          });
        }

        const earnedXp = correctCount * 30;
        const todayIndex = (new Date().getDay() + 6) % 7;
        const nextAct = [...(userProfile.activity7Days || [false, false, false, false, false, false, false])];
        nextAct[todayIndex] = true;

      const handleStartNewStratifiedQuiz = () => {

      // ========================================================================
      // STATE TRUNG TÂM NẠP ĐỀ ĐA ĐỊNH DẠNG (.DOCX, .PDF, ẢNH, JSON) & DUYỆT 10.000 CÂU

      // State Duyệt & Tìm kiếm Kho 10.000 Câu Hỏi (Pagination 20-50 câu/trang)

      const filteredBankQuestions = useMemo(() => {

          if (qClean) {

      }, [allQuestions, bankSubjectFilter, bankChapterFilter, bankLevelFilter, bankTypeFilter, bankSearchQuery]);

      const totalBankPages = Math.max(1, Math.ceil(filteredBankQuestions.length / bankPageSize));
      const paginatedBankSlice = useMemo(() => {
        const safePage = Math.min(bankCurrentPage, totalBankPages);
        const start = (safePage - 1) * bankPageSize;

      // Hàm chuẩn hóa văn bản thô từ Word/PDF sang danh sách câu hỏi có đầy đủ LaTeX, Bẫy & Lời giải
      const parseRawTextToStructuredQuestions = (textInput, defaultSubject) => {
        const blocks = String(textInput || "")
          .split(/(?=Câu\s+\d+[:.]|Bài\s+\d+[:.])/i)
          .map((b) => b.trim())
          .filter(Boolean);

        const targetChapters = defaultSubject === "chemistry" ? CHEMISTRY_CHAPTERS : MATH_CHAPTERS;

        return blocks.map((block, idx) => {
          const lines = block.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
          const firstLine = lines[0]?.replace(/^(Câu|Bài)\s+\d+[:.]\s*/i, "") || "Câu hỏi trích xuất #" + (idx + 1);
          const optA = lines.find((l) => /^A[.:)]/i.test(l)) || "A. Phương án A";
          const optB = lines.find((l) => /^B[.:)]/i.test(l)) || "B. Phương án B";
          const optC = lines.find((l) => /^C[.:)]/i.test(l)) || "C. Phương án C";
          const optD = lines.find((l) => /^D[.:)]/i.test(l)) || "D. Phương án D";
          const ansMatch = block.match(/(?:Đáp án|ĐA)\s*[:=]\s*([A-D0-9.,-]+)/i);

          // Tự động nhận diện chương phù hợp theo từ khóa
          let detectedTopic = targetChapters[0].name;
          const lower = block.toLowerCase();
          if (defaultSubject === "chemistry") {
            if (lower.includes("ph") || lower.includes("kc")) detectedTopic = CHEMISTRY_CHAPTERS[0].name;
            else if (lower.includes("e5") || lower.includes("nhiệt")) detectedTopic = CHEMISTRY_CHAPTERS[1].name;
            else if (lower.includes("fec2o4") || lower.includes("electron")) detectedTopic = CHEMISTRY_CHAPTERS[2].name;
            else if (lower.includes("ir") || lower.includes("1700")) detectedTopic = CHEMISTRY_CHAPTERS[4].name;
            else if (lower.includes("triglyceride") || lower.includes("catechin") || lower.includes("ester")) detectedTopic = CHEMISTRY_CHAPTERS[8].name;
          } else {
            if (lower.includes("sin") || lower.includes("cos")) detectedTopic = MATH_CHAPTERS[0].name;
            else if (lower.includes("cấp số")) detectedTopic = MATH_CHAPTERS[1].name;
            else if (lower.includes("lim")) detectedTopic = MATH_CHAPTERS[2].name;
            else if (lower.includes("log")) detectedTopic = MATH_CHAPTERS[5].name;
            else if (lower.includes("đạo hàm") || lower.includes("tiếp tuyến")) detectedTopic = MATH_CHAPTERS[6].name;
          }

          return {
            id: "Q-" + String(10001 + customQuestions.length + idx).padStart(5, "0"),
            subject: defaultSubject,
            topic: detectedTopic,
            level: LEVELS_LIST[idx % 4],
            type: "mcq",
            question: firstLine,
            options: [optA, optB, optC, optD],
            correctAnswer: ansMatch ? ansMatch[1].toUpperCase() : "A",
            hint: "Phân tích dữ kiện gốc, bảo toàn số mol / biến đổi đại số tương đương.",
            trapNote: "Cẩn thận hệ số cân bằng và tuyệt đối không làm tròn số trung gian.",
            studySuggestion: "Ôn lại chuyên đề " + detectedTopic.split(":")[0],
            explanation: buildLocalFirstPrinciplesSolution(firstLine)
          };
        });
      };

      // Xử lý nạp File đa định dạng: .docx (Mammoth.js), .pdf (PDF.js + Gemini Base64), Ảnh, .json, .txt
      const handleMultiFormatFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploadedFileName(file.name);
        setFileParsingLoading(true);
        const ext = file.name.split(".").pop().toLowerCase();

        try {
          // 1. ĐỌC FILE MICROSOFT WORD (.DOCX) BẰNG MAMMOTH.JS
          if (ext === "docx" && window.mammoth) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await window.mammoth.extractRawText({ arrayBuffer });
            const extractedText = (result.value || "").trim();
            setRawDocText(extractedText);
            const parsedList = parseRawTextToStructuredQuestions(extractedText, activeSubject);
            setExtractedPreviewList(parsedList);
            setFileParsingLoading(false);
            showToast("Đã đọc tệp Word (.docx) bằng Mammoth.js và bóc tách " + parsedList.length + " câu hỏi!");
            return;
          }

          // 2. ĐỌC FILE PDF (.PDF) LỚP 1 (PDF.JS) + LỚP 2 (GEMINI MULTIMODAL BASE64)
          if (ext === "pdf") {
            const arrayBuffer = await file.arrayBuffer();
            let fullPdfText = "";

            if (window.pdfjsLib) {
              try {
                const pdfDoc = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                  const page = await pdfDoc.getPage(pageNum);
                  const textContent = await page.getTextContent();
                  const pageStr = textContent.items.map((it) => it.str).join(" ");
                  fullPdfText += pageStr + "\n\n";
                }
              } catch (pdfErr) {}
            }

            // Lớp 2: Nếu PDF là bản scan hoặc cần Gemini Multimodal nhận diện công thức
            const apiKey = (APP_CONFIG.GEMINI_API_KEY || "").trim();
            if ((!fullPdfText.trim() || fullPdfText.trim().length < 25) && apiKey && apiKey.length > 15) {
              try {
                const base64Pdf = await new Promise((resolve) => {
                  const reader = new FileReader();
                  reader.onload = () => resolve(String(reader.result).split(",")[1]);
                  reader.readAsDataURL(file);
                });
                const resp = await fetch(
                  "https://generativelanguage.googleapis.com/v1beta/models/" +
                    APP_CONFIG.GEMINI_MODEL +
                    ":generateContent?key=" +
                    apiKey,
                  {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      contents: [
                        {
                          role: "user",
                          parts: [
                            { text: "Hãy trích xuất toàn bộ câu hỏi trong file PDF này sang văn bản chuẩn LaTeX ($...$), giữ cấu trúc Câu 1:, A., B., C., D., Đáp án:." },
                            { inlineData: { mimeType: "application/pdf", data: base64Pdf } }
                          ]
                        }
                      ]
                    })
                  }
                );
                const data = await resp.json();
                const aiPdfText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (aiPdfText) fullPdfText = aiPdfText;
              } catch (err) {}
            }

            const finalPdfText = fullPdfText.trim() || rawDocText;
            setRawDocText(finalPdfText);
            const parsedList = parseRawTextToStructuredQuestions(finalPdfText, activeSubject);
            setExtractedPreviewList(parsedList);
            setFileParsingLoading(false);
            showToast("Đã quét tệp PDF (" + file.name + ") và bóc tách " + parsedList.length + " câu hỏi!");
            return;
          }

          // 3. ĐỌC FILE JSON NGÂN HÀNG ĐỀ
          if (ext === "json") {
            const txt = await file.text();
            const jsonArr = JSON.parse(txt);
            if (Array.isArray(jsonArr)) {
              setExtractedPreviewList(jsonArr);
              setFileParsingLoading(false);
              showToast("Đã nạp " + jsonArr.length + " câu hỏi từ tệp JSON!");
              return;
            }
          }

          // 4. ĐỌC FILE TXT / CSV
          if (ext === "txt" || ext === "csv") {
            const txt = await file.text();
            setRawDocText(txt);
            const parsedList = parseRawTextToStructuredQuestions(txt, activeSubject);
            setExtractedPreviewList(parsedList);
            setFileParsingLoading(false);
            showToast("Đã đọc tệp văn bản và bóc tách " + parsedList.length + " câu hỏi!");
            return;
          }

          // 5. ĐỌC FILE ẢNH CHỤP ĐỀ THI (.PNG, .JPG, .WEBP) QUA GEMINI MULTIMODAL
          if (["png", "jpg", "jpeg", "webp"].includes(ext)) {
            const base64Img = await new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = () => resolve(String(reader.result).split(",")[1]);
              reader.readAsDataURL(file);
            });
            const apiKey = (APP_CONFIG.GEMINI_API_KEY || "").trim();
            let extractedImgText = rawDocText;
            if (apiKey && apiKey.length > 15) {
              try {
                const resp = await fetch(
                  "https://generativelanguage.googleapis.com/v1beta/models/" +
                    APP_CONFIG.GEMINI_MODEL +
                    ":generateContent?key=" +
                    apiKey,
                  {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      contents: [
                        {
                          role: "user",
                          parts: [
                            { text: "Trích xuất các câu hỏi trong ảnh chụp đề thi này sang định dạng Câu 1:, A., B., C., D., Đáp án: kèm công thức LaTeX $...$." },
                            { inlineData: { mimeType: file.type || "image/jpeg", data: base64Img } }
                          ]
                        }
                      ]
                    })
                  }
                );
                const data = await resp.json();
                const aiText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (aiText) extractedImgText = aiText;
              } catch (e) {}
            }
            setRawDocText(extractedImgText);
            const parsedList = parseRawTextToStructuredQuestions(extractedImgText, activeSubject);
            setExtractedPreviewList(parsedList);
            setFileParsingLoading(false);
            showToast("Đã quét OCR ảnh đề thi và tạo " + parsedList.length + " câu hỏi!");
            return;
          }
        } catch (err) {}

        setFileParsingLoading(false);
        showToast("Đã nạp nội dung tệp vào trình phân tích AI!");
      };

      const handleParseRawTextPreview = () => {

      // ========================================================================

      // ========================================================================

      const [irWaveNumber, setIrWaveNumber] = useState(1700);

            transmittance: 12
          };
        }
        if (v >= 3200 && v <= 3600) {
          return {
            bond: "Liên kết đơn O-H (Alcohol / Phenol)",
            compound: "Alcohol, Phenol (liên kết hydrogen liên phân tử)",
            shape: "Peak hấp thụ MẠNH và TÙ RỘNG",

            shape: "Peak RẤT RỘNG và ĐẶC TRƯNG kéo dài",
            formula: "$\\tilde{\\nu}(\\text{O-H acid}) \\in [2500; 3300]\\text{ cm}^{-1}$",

          };

          };

          compound: "Không có mũi hấp thụ nhóm chức chính tại vị trí này",
          shape: "Đường nền truyền qua cao (~92% Transmittance)",
          formula: "$\\tilde{\\nu} = " + v + "\\text{ cm}^{-1}$",

      const NAV_ITEMS = [
        { id: "dashboard", icon: "fa-house-laptop", label: "Trang chủ (10.000 Câu)", short: "Trang chủ" },

                    </div>
                    <span className="text-xs font-bold text-emerald-400">
                      Đang lưu trữ: {allQuestions.length.toLocaleString("vi-VN")} câu hỏi (Q-00001 → Q-{String(allQuestions.length).padStart(5, "0")})
                    </span>
                  </div>

                  {/* TAB CON 1: NẠP FILE WORD (.DOCX), PDF (.PDF), ẢNH CHỤP & XEM TRƯỚC */}
                  {importerSubTab === "upload" && (
                    <div className="space-y-6">
                      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        <div className={"lg:col-span-5 rounded-3xl border p-6 space-y-4 " + currentTheme.panel}>
                          <h2 className="font-extrabold text-base flex items-center gap-2">
                            <i className="fa-solid fa-cloud-arrow-up text-emerald-400"></i>
                            <span>Nạp Đề Thi Đa Định Dạng (Word / PDF / Ảnh / JSON)</span>
                          </h2>
                          <p className="text-xs opacity-80 leading-relaxed">
                            Hỗ trợ trích xuất trực tiếp từ file <strong>Microsoft Word (.docx)</strong> qua Mammoth.js, <strong>PDF (.pdf)</strong> 2 lớp qua PDF.js + Gemini Multimodal Base64, ảnh chụp đề thi và file JSON/TXT.
                          </p>

                          <label className="border-2 border-dashed border-emerald-500/40 hover:border-emerald-400 rounded-3xl p-6 flex flex-col items-center justify-center text-center cursor-pointer bg-slate-950/40 transition-all space-y-2">
                            <div className="flex items-center gap-3 text-2xl">
                              <i className="fa-solid fa-file-word text-sky-400"></i>
                              <i className="fa-solid fa-file-pdf text-rose-400"></i>
                              <i className="fa-solid fa-file-image text-amber-400"></i>
                              <i className="fa-solid fa-file-code text-emerald-400"></i>
                            </div>
                            <div className="text-xs font-extrabold">
                              {fileParsingLoading
                                ? "Đang giải mã cấu trúc File & chuẩn hóa LaTeX..."
                                : "Bấm để chọn hoặc Kéo - Thả tệp (.docx, .pdf, .png, .jpg, .json, .txt)"}
                            </div>
                            {uploadedFileName && (
                              <span className="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-[11px] font-bold">
                                Đã nạp: {uploadedFileName}
                              </span>
                            )}
                            <input
                              type="file"
                              accept=".docx,.pdf,.png,.jpg,.jpeg,.webp,.txt,.csv,.json"
                              onChange={handleMultiFormatFileUpload}
                              className="hidden"
                            />
                          </label>

                          <div className="space-y-1.5">
                            <label className="text-xs font-bold opacity-75">
                              Nội dung trích xuất từ File (hoặc dán trực tiếp văn bản đề thi):
                            </label>
                            <textarea
                              rows={6}
                              value={rawDocText}
                              onChange={(e) => setRawDocText(e.target.value)}
                              className="w-full rounded-2xl bg-slate-950/75 text-slate-100 border border-slate-700 p-3 text-xs font-mono"
                            />
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <button
                              onClick={handleParseRawTextPreview}
                              className="py-3 px-4 rounded-2xl font-extrabold text-xs bg-slate-800 hover:bg-slate-700 text-white"
                            >
                              🔍 Phân Tích & Xem Trước
                            </button>
                            <button
                              onClick={handleSaveExtractedTo10kBank}
                              className={"py-3 px-4 rounded-2xl font-extrabold text-xs shadow-lg " + currentTheme.accentBg}
                            >
                              💾 Lưu Vào Kho 10.000+ & Supabase
                            </button>
                          </div>
                        </div>

                        {/* Bảng Xem Trước (Preview Table) các câu hỏi vừa bóc tách */}
                        <div className={"lg:col-span-7 rounded-3xl border p-6 space-y-4 " + currentTheme.panel}>
                          <div className="flex items-center justify-between">
                            <h3 className="font-extrabold text-base">
                              Bảng Xem Trước Câu Hỏi Bóc Tách ({extractedPreviewList.length} câu)
                            </h3>
                            {extractedPreviewList.length > 0 && (
                              <button
                                onClick={handleSaveExtractedTo10kBank}
                                className={"px-3.5 py-1.5 rounded-xl text-xs font-extrabold " + currentTheme.accentBg}
                              >
                                + Lưu toàn bộ ({extractedPreviewList.length} câu)
                              </button>
                            )}
                          </div>

                          {extractedPreviewList.length === 0 ? (
                            <div className="p-10 rounded-2xl bg-slate-950/45 border border-dashed border-slate-800 text-center space-y-2">
                              <i className="fa-solid fa-table-list text-2xl opacity-40"></i>
                              <div className="text-xs font-bold">
                                Hãy tải lên tệp Word (.docx) / PDF (.pdf) hoặc bấm "Phân Tích & Xem Trước"
                              </div>
                              <p className="text-[11px] opacity-65">
                                Hệ thống sẽ tự động phân loại Chương, Mức độ, chuẩn hóa công thức LaTeX và tạo lời giải Nguyên lý gốc.
                              </p>
                            </div>
                          ) : (
                            <div className="space-y-3 max-h-[460px] overflow-y-auto pr-1">
                              {extractedPreviewList.map((item, idx) => (
                                <div
                                  key={item.id}
                                  className="p-4 rounded-2xl bg-slate-950/60 border border-slate-800 space-y-2 text-xs"
                                >
                                  <div className="flex flex-wrap items-center justify-between gap-2">
                                    <span className="px-2.5 py-0.5 rounded-lg bg-emerald-500/20 text-emerald-300 font-bold">
                                      {item.id} • {item.level}
                                    </span>
                                    <span className="opacity-75 truncate max-w-[260px]">{item.topic}</span>
                                  </div>
                                  <div className="font-semibold text-sm">
                                    <MathChemText content={item.question} />
                                  </div>
                                  <div className="grid grid-cols-2 gap-1.5 opacity-85">
                                    {(item.options || []).map((opt) => (
                                      <div key={opt} className="p-1.5 rounded-lg bg-slate-900/70">
                                        <MathChemText content={opt} />
                                      </div>
                                    ))}
                                  </div>
                                  <div className="text-amber-300 font-semibold">
                                    ⚠️ Bẫy cần tránh: <MathChemText content={item.trapNote} />
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB CON 2: DUYỆT & TÌM KIẾM TOÀN BỘ KHO 10.000 CÂU HỎI (PHÂN TRANG THÔNG MINH) */}
                  {importerSubTab === "bank10k" && (
                    <div className={"rounded-3xl border p-6 space-y-5 " + currentTheme.panel}>
                      <div className="grid grid-cols-1 md:grid-cols-5 gap-3 text-xs">
                        <div className="md:col-span-2">
                          <label className="font-bold opacity-75 block mb-1">
                            Tìm kiếm theo Mã câu (Q-00001..Q-10000) hoặc Từ khóa:
                          </label>
                          <input
                            type="text"
                            value={bankSearchQuery}
                            onChange={(e) => {
                              setBankSearchQuery(e.target.value);
                              setBankCurrentPage(1);
                            }}
                            placeholder="Nhập mã (VD: Q-00001, Q-05001, FeC2O4, Catechin, E5, lim)..."
                            className="w-full px-3.5 py-2 rounded-xl bg-slate-950/80 text-slate-100 border border-slate-700"
                          />
                        </div>

                        <div>
                          <label className="font-bold opacity-75 block mb-1">Môn học:</label>
                          <select
                            value={bankSubjectFilter}
                            onChange={(e) => {
                              setBankSubjectFilter(e.target.value);
                              setBankChapterFilter("ALL");
                              setBankCurrentPage(1);
                            }}
                            className="w-full px-3 py-2 rounded-xl bg-slate-950/80 text-slate-100 border border-slate-700"
                          >
                            <option value="ALL">Tất cả (10.000+ câu)</option>
                            <option value="chemistry">🧪 Hóa học (5.000 câu)</option>
                            <option value="math">📐 Toán học (5.000 câu)</option>
                          </select>
                        </div>

                        <div>
                          <label className="font-bold opacity-75 block mb-1">Chương chuyên đề:</label>
                          <select
                            value={bankChapterFilter}
                            onChange={(e) => {
                              setBankChapterFilter(e.target.value);
                              setBankCurrentPage(1);
                            }}
                            className="w-full px-3 py-2 rounded-xl bg-slate-950/80 text-slate-100 border border-slate-700"
                          >
                            <option value="ALL">Tất cả 18 chương</option>
                            {(bankSubjectFilter === "math"
                              ? MATH_CHAPTERS
                              : bankSubjectFilter === "chemistry"
                              ? CHEMISTRY_CHAPTERS
                              : [...CHEMISTRY_CHAPTERS, ...MATH_CHAPTERS]
                            ).map((ch) => (
                              <option key={ch.id} value={ch.name}>
                                {ch.name}
                              </option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="font-bold opacity-75 block mb-1">Mức độ & Số câu/trang:</label>
                          <div className="flex gap-1.5">
                            <select
                              value={bankLevelFilter}
                              onChange={(e) => {
                                setBankLevelFilter(e.target.value);
                                setBankCurrentPage(1);
                              }}
                              className="flex-1 px-2 py-2 rounded-xl bg-slate-950/80 text-slate-100 border border-slate-700"
                            >
                              <option value="ALL">Mọi mức độ</option>
                              {LEVELS_LIST.map((lv) => (
                                <option key={lv} value={lv}>
                                  {lv}
                                </option>
                              ))}
                            </select>
                            <select
                              value={bankPageSize}
                              onChange={(e) => {
                                setBankPageSize(Number(e.target.value));
                                setBankCurrentPage(1);
                              }}
                              className="w-20 px-2 py-2 rounded-xl bg-slate-950/80 text-slate-100 border border-slate-700 font-bold"
                            >
                              <option value={20}>20/tr</option>
                              <option value={50}>50/tr</option>
                            </select>
                          </div>
                        </div>
                      </div>

                      {/* Thanh điều hướng phân trang */}
                      <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800 text-xs">
                        <div>
                          Tìm thấy <strong>{filteredBankQuestions.length.toLocaleString("vi-VN")}</strong> câu hỏi • Trang{" "}
                          <strong>{bankCurrentPage}</strong> / <strong>{totalBankPages}</strong>
                        </div>
                        <div className="flex items-center gap-1.5">
                          <button
                            disabled={bankCurrentPage <= 1}
                            onClick={() => setBankCurrentPage(1)}
                            className="px-2.5 py-1.5 rounded-xl bg-slate-900 border border-slate-700 disabled:opacity-40"
                          >
                            « Đầu
                          </button>
                          <button
                            disabled={bankCurrentPage <= 1}
                            onClick={() => setBankCurrentPage((p) => Math.max(1, p - 1))}
                            className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 disabled:opacity-40"
                          >
                            ‹ Trước
                          </button>
                          <button
                            disabled={bankCurrentPage >= totalBankPages}
                            onClick={() => setBankCurrentPage((p) => Math.min(totalBankPages, p + 1))}
                            className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 disabled:opacity-40"
                          >
                            Sau ›
                          </button>
                          <button
                            disabled={bankCurrentPage >= totalBankPages}
                            onClick={() => setBankCurrentPage(totalBankPages)}
                            className="px-2.5 py-1.5 rounded-xl bg-slate-900 border border-slate-700 disabled:opacity-40"
                          >
                            Cuối »
                          </button>
                        </div>
                      </div>

                      {/* Danh sách câu hỏi trên trang hiện tại */}
                      <div className="space-y-3 max-h-[520px] overflow-y-auto pr-1">
                        {paginatedBankSlice.map((q) => (
                          <div
                            key={q.id}
                            className="p-4 rounded-2xl bg-slate-950/55 border border-slate-800 space-y-2 text-xs"
                          >
                            <div className="flex flex-wrap items-center justify-between gap-2">
                              <div className="flex items-center gap-2">
                                <span className="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 font-mono font-bold">
                                  {q.id}
                                </span>
                                <span className="px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-700 font-semibold">
                                  {q.level}
                                </span>
                                <span className="opacity-75">{q.topic}</span>
                              </div>
                              <span className="font-bold text-amber-300">Đáp án: {q.correctAnswer || "Đúng/Sai"}</span>
                            </div>
                            <div className="text-sm font-medium">
                              <MathChemText content={q.question} />
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* TAB CON 3: TẠO CÂU HỎI THỦ CÔNG & XEM TRƯỚC CÔNG THỨC LIVE KATEX */}
                  {importerSubTab === "manual" && (
                    <form
                      onSubmit={handleSaveManualQuestion}
                      className={"rounded-3xl border p-6 space-y-4 max-w-3xl mx-auto " + currentTheme.panel}
                    >
                      <h2 className="font-extrabold text-base flex items-center gap-2">
                        <i className="fa-solid fa-square-root-variable text-cyan-400"></i>
                        <span>Tạo Câu Hỏi Thủ Công & Xem Trước Công Thức (Live KaTeX)</span>
                      </h2>

                      <div className="flex flex-wrap gap-1.5">
                        {[
                          { label: "→", code: " $\\rightarrow$ " },
                          { label: "⇌", code: " $\\rightleftharpoons$ " },
                          { label: "ΔrH°298", code: " $\\Delta_r H^\\circ_{298}$ " },
                          { label: "ν̃ (cm⁻¹)", code: " $\\tilde{\\nu}\\text{ (cm}^{-1}\\text{)}$ " },
                          { label: "FeC₂O₄", code: " $\\text{FeC}_2\\text{O}_4$ " },
                          { label: "Phân số", code: " $\\frac{a}{b}$ " },
                          { label: "Căn thức", code: " $\\sqrt{x}$ " },
                          { label: "lim", code: " $\\lim_{x \\to x_0}$ " }
                        ].map((sym) => (
                          <button
                            type="button"
                            key={sym.label}
                            onClick={() =>
                              setNewQForm((prev) => ({ ...prev, question: prev.question + sym.code }))
                            }
                            className="px-2.5 py-1 rounded-xl bg-slate-950/70 hover:bg-slate-800 border border-slate-700 text-xs font-mono"
                          >
                            {sym.label}
                          </button>
                        ))}
                      </div>

                      <textarea
                        rows={3}
                        value={newQForm.question}
                        onChange={(e) => setNewQForm((prev) => ({ ...prev, question: e.target.value }))}
                        placeholder="Nhập nội dung câu hỏi (dùng $...$ cho công thức)..."
                        className="w-full rounded-2xl bg-slate-950/75 text-slate-100 border border-slate-700 p-3 text-xs"
                      />

                      <div className="p-3.5 rounded-2xl bg-slate-950/60 border border-emerald-500/30 space-y-1">
                        <div className="text-[11px] font-bold text-emerald-400">
                          👁️ Xem trước công thức trực tiếp (Live KaTeX Preview):
                        </div>
                        <div className="text-sm">
                          <MathChemText content={newQForm.question} />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        {["optionA", "optionB", "optionC", "optionD"].map((key, i) => (
                          <input
                            key={key}
                            type="text"
                            value={newQForm[key]}
                            onChange={(e) => setNewQForm((prev) => ({ ...prev, [key]: e.target.value }))}
                            placeholder={"Phương án " + ["A", "B", "C", "D"][i]}
                            className="px-3 py-2 rounded-xl bg-slate-950/75 text-slate-100 border border-slate-700 text-xs"
                          />
                        ))}
                      </div>

                      <button
                        type="submit"
                        className={"w-full py-3 rounded-2xl font-extrabold text-xs shadow-lg " + currentTheme.accentBg}
                      >
                        + Lưu Câu Hỏi Vào Ngân Hàng 10.000+ Câu Hỏi
                      </button>
                    </form>
                  )}
                </div>
              )}

              {/* ================================================================
                  PHÂN KHU 7: BXH & TIẾN ĐỘ (SVG RADAR 6 TRỤC & AREA CHART)
                 ================================================================ */}
              {activeTab === "analytics" && (
                <div className="space-y-6">
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className={"rounded-3xl border p-6 space-y-4 " + currentTheme.panel}>
                      <h3 className="font-extrabold text-base">
                        Biểu đồ SVG Radar 6 Trục ({activeSubject === "chemistry" ? "Môn Hóa Học" : "Môn Toán Học"})
                      </h3>
                      <RadarChartSVG axes={radarAxesData} accentColor={currentTheme.hex} />
                    </div>

                    <div className={"rounded-3xl border p-6 space-y-4 " + currentTheme.panel}>
                      <h3 className="font-extrabold text-base">
                        Biểu đồ Tiến Độ Điểm Số Qua Các Lần Thi (SVG Area Chart)
                      </h3>
                      <AreaChartSVG history={quizHistory} accentColor={currentTheme.hex} />
                    </div>
                  </div>

                  <div className={"rounded-3xl border p-6 space-y-4 " + currentTheme.panel}>
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <h3 className="font-extrabold text-base flex items-center gap-2">
                        <i className="fa-solid fa-trophy text-amber-400"></i>
                        <span>Bảng Xếp Hạng Thực Tế (Đồng bộ Realtime từ Supabase)</span>
                      </h3>
                      <button
                        onClick={fetchRealtimeLeaderboard}
                        className="px-3 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold"
                      >
                        🔄 Làm mới Bảng xếp hạng
                      </button>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs md:text-sm border-collapse">
                        <thead>
                          <tr className="border-b border-slate-800 opacity-75">
                            <th className="py-3 px-3">Hạng</th>
                            <th className="py-3 px-3">Học sinh</th>
                            <th className="py-3 px-3">Danh hiệu Rank</th>
                            <th className="py-3 px-3">Chuỗi Streak</th>
                            <th className="py-3 px-3">Tổng XP</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {(leaderboardList.length > 0
                            ? leaderboardList.map((item) => ({
                                name: item.full_name,
                                email: item.email,
                                rank: item.rank_title || computeRankByXP(item.xp),
                                streak: item.streak || 0,
                                xp: item.xp || 0,
                                highlight: userProfile.email && item.email === userProfile.email
                              }))
                            : [
                                {
                                  name: userProfile.name + " (Bạn)",
                                  email: userProfile.email,
                                  rank: userProfile.rankTitle,
                                  streak: userProfile.streak,
                                  xp: userProfile.xp,
                                  highlight: true
                                }
                              ]
                          ).map((row, index) => (
                            <tr
                              key={(row.email || row.name) + "_" + index}
                              className={row.highlight ? "bg-emerald-500/15 font-bold" : ""}
                            >
                              <td className="py-3 px-3 font-extrabold text-amber-400">#{index + 1}</td>
                              <td className="py-3 px-3">{row.name}</td>
                              <td className="py-3 px-3">{row.rank}</td>
                              <td className="py-3 px-3 text-amber-300">🔥 {row.streak} ngày</td>
                              <td className={"py-3 px-3 font-bold " + currentTheme.accentText}>
                                ⚡ {row.xp} XP
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}
            </main>

            {/* THANH ĐIỀU HƯỚNG ĐÁY KÍNH MỜ CHO ĐIỆN THOẠI */}
            {!isZenMode && (
              <nav
                className={
                  (isForcedMobile ? "flex" : "flex md:hidden") +
                  " fixed bottom-0 left-0 right-0 z-40 border-t " +
                  currentTheme.panel +
                  " px-1 py-1.5 pb-[env(safe-area-inset-bottom)] justify-around items-center"
                }
              >
                {NAV_ITEMS.map((item) => {
                  const active = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={
                        "flex flex-col items-center justify-center py-1 px-2 rounded-xl text-[10px] font-bold transition-all " +
                        (active ? currentTheme.accentText : "opacity-65")
                      }
                    >
                      <i className={"fa-solid " + item.icon + " text-sm mb-0.5"}></i>
                      <span className="truncate max-w-[54px]">{item.short}</span>
                    </button>
                  );
                })}
              </nav>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
