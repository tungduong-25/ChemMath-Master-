    // 3. BỘ DỰNG CÔNG THỨC MathChemText KHÔNG BAO GIỜ LỖI
    // ============================================================================
    function sanitizeLatexInput(raw) {
      if (raw === null || raw === undefined) return "";
      let str = String(raw);
      // Khôi phục các ký tự thoát bị nuốt trong JSON (\t -> \text, \f -> \frac, \r -> \rightarrow, \b -> \beta)
      str = str
        .replace(/\t(?=[a-zA-Z])/g, "\\t")
        .replace(/\f(?=[a-zA-Z])/g, "\\f")
        .replace(/\r(?=[a-zA-Z])/g, "\\r")
        .replace(/\x08(?=[a-zA-Z])/g, "\\b");

      // Tự động đóng dấu $ bị lẻ
      const singleDollarCount = (str.match(/(?<!\$)\$(?!\$)/g) || []).length;
      if (singleDollarCount % 2 !== 0) {
        str += "$";
      }
      return str;
    }

    function fallbackHtmlFormat(text) {
      return text
        .replace(/\\text\{([^}]*)\}/g, "$1")
        .replace(/\\ce\{([^}]*)\}/g, "$1")
        .replace(/\\rightarrow/g, "→")
        .replace(/\\rightleftharpoons/g, "⇌")
        .replace(/\\approx/g, "≈")
        .replace(/\\Delta/g, "Δ")
        .replace(/\\times/g, "×")
        .replace(/\\cdot/g, "·")
        .replace(/\\circ/g, "°")
        .replace(/\\tilde\{\\nu\}/g, "ν̃")
        .replace(/_\{([^}]+)\}/g, "<sub>$1</sub>")
        .replace(/_([0-9a-zA-Z])/g, "<sub>$1</sub>")
        .replace(/\^\{([^}]+)\}/g, "<sup>$1</sup>")
        .replace(/\^([0-9a-zA-Z+\-°]+)/g, "<sup>$1</sup>");
    }

    function MathChemText({ content, className = "", block = false }) {
      const renderedHtml = useMemo(() => {
        const clean = sanitizeLatexInput(content);
        if (!clean) return "";

        const tokenRegex = /(\$\$[\s\S]+?\$\$|\$[^$]+?\$)/g;
        const parts = clean.split(tokenRegex);

        return parts
          .map((part) => {
            if (!part) return "";
            const isDisplay = part.startsWith("$$") && part.endsWith("$$");
            const isInline = !isDisplay && part.startsWith("$") && part.endsWith("$");

            if (isDisplay || isInline) {
              const mathExpr = isDisplay ? part.slice(2, -2).trim() : part.slice(1, -1).trim();
              if (window.katex && typeof window.katex.renderToString === "function") {
                try {
                  return window.katex.renderToString(mathExpr, {
                    displayMode: isDisplay || block,
                    throwOnError: false,
                    strict: false,
                    trust: true
                  });
                } catch (e) {
                  return `<span class="font-mono text-amber-300">${fallbackHtmlFormat(mathExpr)}</span>`;
                }
              }
              return `<span class="font-mono">${fallbackHtmlFormat(mathExpr)}</span>`;
            }

            // Văn bản thường (chuyển xuống dòng thành <br/>)
            return part
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
              .replace(/\n/g, "<br/>");
          })
          .join("");
      }, [content, block]);

      return (
        <span
          className={`selectable-text break-words leading-relaxed ${className}`}
          dangerouslySetInnerHTML={{ __html: renderedHtml }}
        />
      );
    }

- Theo nguyên lý cấu tạo hữu cơ, khi gắn thêm $1$ nhóm $-\\text{OH}$ ($17\\text{ đvC}$) vào vòng thơm, nhóm $-\\text{OH}$ sẽ **thay thế $1$ nguyên tử $\\text{H}$ ($1\\text{ đvC}$)** gắn trên vòng benzen.
- Độ tăng phân tử khối thực tế là:
$$\\Delta M = 17 - 1 = +16\\text{ đvC}$$
- Hợp chất mới có công thức $\\text{C}_{15}\\text{H}_{14}\\text{O}_7$ và phân tử khối chuẩn xác là:
$$M = 290 + 16 = 306\\text{ g/mol}$$

**2. Thủy phân hoàn toàn $0,2\\text{ mol}$ Triglyceride $\\text{X}$ ($\\text{C}_{57}\\text{H}_{102}\\text{O}_6$):**
- Phân tử khối của $\\text{X}$: $M_{\\text{X}} = 57 \\times 12 + 102 \\times 1 + 6 \\times 16 = 882\\text{ g/mol}$.
- Phương trình phản ứng xà phòng hóa:
$$\\text{C}_{57}\\text{H}_{102}\\text{O}_6 + 3\\text{NaOH} \\xrightarrow{t^\\circ} \\text{C}_3\\text{H}_5(\\text{OH})_3 + 3\\text{Muối}$$
- Số mol $\\text{NaOH}$ phản ứng vừa đủ:
$$n_{\\text{NaOH}} = 3n_{\\text{X}} = 3 \\times 0,2 = 0,6\\text{ mol}$$
- Thể tích dung dịch $\\text{NaOH}$ $1,5\\text{ M}$ cần dùng:
$$V_{\\text{dd NaOH}} = \\frac{0,6}{1,5} = 0,4\\text{ L} = 400\\text{ mL}$$

**3. Nhận diện tín hiệu Phổ hồng ngoại (IR) tại $\\tilde{\\nu} \\approx 1700\\text{ cm}^{-1}$:**
- Peak hấp thụ mạnh và nhọn tại $\\tilde{\\nu} \\approx 1700\\text{ cm}^{-1}$ đặc trưng cho dao động hóa trị của **liên kết đôi $\\text{C=O}$ (nhóm carbonyl)**.`;
      }

      if (q.includes("e5") || q.includes("octane") || q.includes("ethanol")) {
        return `**1. Xác định thể tích và khối lượng từng cấu tử trong $1000\\text{ mL}$ xăng E5:**
- Thể tích ethanol ($\\text{C}_2\\text{H}_5\\text{OH}$): $V_{\\text{ethanol}} = 1000 \\times 5\\% = 50\\text{ mL} \\Rightarrow m_{\\text{ethanol}} = 50 \\times 0,8 = 40\\text{ g}$.
- Thể tích octane ($\\text{C}_8\\text{H}_{18}$): $V_{\\text{octane}} = 1000 \\times 95\\% = 950\\text{ mL} \\Rightarrow m_{\\text{octane}} = 950 \\times 0,7 = 665\\text{ g}$.

**2. Thiết lập số mol dạng phân số nguyên gốc (Tuyệt đối không làm tròn số trung gian):**
$$n_{\\text{ethanol}} = \\frac{40}{46}\\text{ mol}, \\qquad n_{\\text{octane}} = \\frac{665}{114}\\text{ mol}$$

**3. Tính tổng nhiệt lượng tỏa ra khi đốt cháy $1\\text{ L}$ xăng E5:**
$$Q = n_{\\text{ethanol}} \\times 1367 + n_{\\text{octane}} \\times 5470 = \\frac{40}{46} \\times 1367 + \\frac{665}{114} \\times 5470$$
$$Q = \\frac{54680}{46} + \\frac{3637550}{114} \\approx 1188,6957 + 31908,3333 = 33097,029\\text{ kJ} \\approx 33,1\\text{ MJ}$$`;
      }

      return `**1. Phân tích từ Nguyên lý gốc (First Principles):**
- Đề bài yêu cầu khảo sát biểu thức: "${queryText}".
- Với bài toán cực trị hệ số góc tiếp tuyến của $f(x) = x^3 - 3x^2 + 4x - 5$, hệ số góc tại hoành độ tiếp điểm $x_0$ được xác định bởi đạo hàm bậc nhất:
$$k(x_0) = f'(x_0) = 3x_0^2 - 6x_0 + 4$$

**2. Biến đổi đại số tường minh (Hoàn thành bình phương):**
$$k(x_0) = 3(x_0^2 - 2x_0 + 1) + 1 = 3(x_0 - 1)^2 + 1$$
- Do $(x_0 - 1)^2 \\ge 0, \\forall x_0 \\in \\mathbb{R}$, suy ra:
$$k(x_0) \\ge 1 \\quad \\text{(Đạt giá trị nhỏ nhất } k_{\\min} = 1 \\text{ khi } x_0 = 1\\text{)}$$

**3. Kết luận & Phương trình tiếp tuyến tại điểm uốn $M(1; -3)$:**
- Tại $x_0 = 1 \\Rightarrow y_0 = f(1) = 1 - 3 + 4 - 5 = -3$.
- Phương trình tiếp tuyến có hệ số góc nhỏ nhất là:
$$y = 1(x - 1) - 3 \\Leftrightarrow y = x - 4$$`;
    }

    // 7. BIỂU ĐỒ SVG ĐỘNG: RADAR 6 TRỤC & AREA CHART TIẾN ĐỘ
    // ============================================================================
    function RadarChartSVG({ axes, accentColor = "#10b981" }) {
      const size = 290;
      const center = size / 2;
      const radius = 98;
      const levels = [0.25, 0.5, 0.75, 1.0];

      const getPoint = (index, ratio) => {
        const angle = (Math.PI * 2 * index) / axes.length - Math.PI / 2;
        const x = center + radius * ratio * Math.cos(angle);
        const y = center + radius * ratio * Math.sin(angle);
        return { x, y };
      };

      const polygonPoints = axes
        .map((axis, idx) => {
          const p = getPoint(idx, Math.max(0.08, Math.min(1, axis.value / 100)));
          return `${p.x},${p.y}`;
        })
        .join(" ");

      return (
        <svg viewBox={`0 0 ${size} ${size}`} className="w-full max-w-[310px] mx-auto select-none overflow-visible">
          {levels.map((lvl, idx) => {
            const pts = axes
              .map((_, i) => {
                const p = getPoint(i, lvl);
                return `${p.x},${p.y}`;
              })
              .join(" ");
            return (
              <polygon
                key={idx}
                points={pts}
                fill="none"
                stroke="currentColor"
                strokeOpacity={0.18}
                strokeWidth="1"
              />
            );
          })}
          {axes.map((axis, idx) => {
            const end = getPoint(idx, 1);
            const labelPos = getPoint(idx, 1.24);
            return (
              <g key={idx}>
                <line
                  x1={center}
                  y1={center}
                  x2={end.x}
                  y2={end.y}
                  stroke="currentColor"
                  strokeOpacity={0.22}
                  strokeWidth="1"
                />
                <text
                  x={labelPos.x}
                  y={labelPos.y}
                  textAnchor="middle"
                  dominantBaseline="middle"
                  className="fill-current text-[9.5px] font-semibold opacity-85"
                >
                  {axis.shortLabel} ({axis.value}%)
                </text>
              </g>
            );
          })}
          <polygon
            points={polygonPoints}
            fill={accentColor}
            fillOpacity="0.28"
            stroke={accentColor}
            strokeWidth="2.4"
          />
          {axes.map((axis, idx) => {
            const p = getPoint(idx, Math.max(0.08, Math.min(1, axis.value / 100)));
            return (
              <circle
                key={idx}
                cx={p.x}
                cy={p.y}
                r="4"
                fill={accentColor}
                stroke="#0f172a"
                strokeWidth="1.5"
              />
            );
          })}
        </svg>
      );
    }

    function AreaChartSVG({ history, accentColor = "#06b6d4" }) {
      const width = 520;
      const height = 190;
      const padLeft = 36;
      const padRight = 18;
      const padTop = 20;
      const padBottom = 30;
      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      const data = history && history.length > 0
        ? history.slice(-8)
        : [
            { label: "Lần 1", score: 6.8 },
            { label: "Lần 2", score: 7.4 },
            { label: "Lần 3", score: 7.9 },
            { label: "Lần 4", score: 8.5 },
            { label: "Lần 5", score: 9.2 }
          ];

      const points = data.map((d, idx) => {
        const x = padLeft + (data.length === 1 ? plotW / 2 : (idx / (data.length - 1)) * plotW);
        const y = padTop + plotH - (Math.max(0, Math.min(10, d.score)) / 10) * plotH;
        return { x, y, ...d };
      });

      const linePath = points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
      const areaPath = `${linePath} L ${points[points.length - 1].x} ${padTop + plotH} L ${points[0].x} ${padTop + plotH} Z`;

      return (
        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-48 overflow-visible select-none">
          <defs>
            <linearGradient id="scoreGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={accentColor} stopOpacity="0.45" />
              <stop offset="100%" stopColor={accentColor} stopOpacity="0.0" />
            </linearGradient>
          </defs>
          {[0, 2.5, 5, 7.5, 10].map((val, i) => {
            const y = padTop + plotH - (val / 10) * plotH;
            return (
              <g key={i}>
                <line
                  x1={padLeft}
                  y1={y}
                  x2={width - padRight}
                  y2={y}
                  stroke="currentColor"
                  strokeOpacity="0.12"
                  strokeDasharray="3 3"
                />
                <text x={padLeft - 8} y={y + 3} textAnchor="end" className="fill-current text-[10px] opacity-60">
                  {val}
                </text>
              </g>
            );
          })}
          <path d={areaPath} fill="url(#scoreGrad)" />
          <path d={linePath} fill="none" stroke={accentColor} strokeWidth="2.8" strokeLinecap="round" />
          {points.map((p, idx) => (
            <g key={idx}>
              <circle cx={p.x} cy={p.y} r="4.5" fill={accentColor} stroke="#0f172a" strokeWidth="1.5" />
              <text x={p.x} y={p.y - 9} textAnchor="middle" className="fill-current text-[10px] font-bold">
                {p.score}
              </text>
              <text x={p.x} y={height - 8} textAnchor="middle" className="fill-current text-[9.5px] opacity-70">
                {p.label}
              </text>
            </g>
          ))}
        </svg>
      );
    }

        if (apiKey && !apiKey.includes("ĐIỀN_") && apiKey.length > 15) {

                headers: { "Content-Type": "application/json" },

                  systemInstruction: {
                    parts: [{ text: GEMINI_SYSTEM_INSTRUCTION }]

                  contents: [{ role: "user", parts }],
                  generationConfig: {
                    temperature: 0.15
                  }
                })
              }
            );
            const data = await response.json();
            const replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

            shape: "Peak trung bình và nhọn",

                          />
                        </div>
                        <div className="p-3.5 rounded-2xl bg-slate-950/50 border border-slate-800 space-y-1">
                          <div className="font-bold text-cyan-400">
                            2. Cấp số cộng ($d$) & Cấp số nhân ($q$):
                          </div>
                          <MathChemText
                            content={`$$S_n^{\\text{CSC}} = \\frac{n[2u_1 + (n-1)d]}{2}, \\qquad S_n^{\\text{CSN}} = u_1 \\cdot \\frac{1 - q^n}{1 - q} \\;(q \\neq 1)$$`}
                          />
                        </div>
                        <div className="p-3.5 rounded-2xl bg-slate-950/50 border border-slate-800 space-y-1">
                          <div className="font-bold text-amber-300">
                            3. Giới hạn, Mũ - Lôgarit & Đạo hàm tiếp tuyến:
                          </div>
                          <MathChemText
                            content={`$$\\log_{a^k} b = \\frac{1}{k}\\log_a b, \\qquad y - y_0 = f'(x_0)(x - x_0)$$`}
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ================================================================
                  PHÂN KHU 6: TRUNG TÂM NẠP TÀI LIỆU AI & TẠO CÂU HỎI (IMPORTER)
                 ================================================================ */}
              {activeTab === "importer" && (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* Bóc tách tự động văn bản Word/PDF */}
                  <div className={`rounded-3xl border p-6 space-y-4 ${currentTheme.panel}`}>
                    <h2 className="font-extrabold text-base flex items-center gap-2">
                      <i className="fa-solid fa-wand-sparkles text-emerald-400"></i>
                      <span>Bóc Tách Đề Thi Tự Động Từ Word / PDF</span>
                    </h2>
                    <p className="text-xs opacity-75">
                      Dán nội dung đề thi thô để hệ thống tự động tách thành câu hỏi trắc nghiệm chuẩn LaTeX và nạp vào Phòng thi.
                    </p>
                    <textarea
                      rows={7}
                      value={rawDocText}
                      onChange={(e) => setRawDocText(e.target.value)}
                      className="w-full rounded-2xl bg-slate-950/75 text-slate-100 border border-slate-700 p-3.5 text-xs font-mono"
                    />
                    <button
                      onClick={handleAutoParseDoc}
                      className={`w-full py-3 rounded-2xl font-extrabold text-xs shadow-lg ${currentTheme.accentBg}`}
                    >
                      <i className="fa-solid fa-bolt mr-1.5"></i>
                      Bóc Tách Tự Động & Lưu Vào Ngân Hàng Đề
                    </button>
                  </div>

                  {/* Tạo câu hỏi thủ công + Xem trước công thức (Live KaTeX Preview) */}
                  <form
                    onSubmit={handleSaveManualQuestion}
                    className={`rounded-3xl border p-6 space-y-4 ${currentTheme.panel}`}
                  >
                    <h2 className="font-extrabold text-base flex items-center gap-2">
                      <i className="fa-solid fa-square-root-variable text-cyan-400"></i>
                      <span>Tạo Câu Hỏi Thủ Công & Xem Trước Công Thức (Live KaTeX)</span>
                    </h2>

                    {/* Thanh phím tắt ký hiệu Hóa học / Toán học */}
                    <div className="flex flex-wrap gap-1.5">
                      {[
                        { label: "→", code: " $\\rightarrow$ " },
                        { label: "⇌", code: " $\\rightleftharpoons$ " },
                        { label: "ΔrH°298", code: " $\\Delta_r H^\\circ_{298}$ " },
                        { label: "ν̃ (cm⁻¹)", code: " $\\tilde{\\nu}\\text{ (cm}^{-1}\\text{)}$ " },
                        { label: "FeC₂O₄", code: " $\\text{FeC}_2\\text{O}_4$ " },
                        { label: "Phân số", code: " $\\frac{a}{b}$ " },
                        { label: "Căn thức", code: " $\\sqrt{x}$ " },
                        { label: "lim", code: " $\\lim_{x \\to x_0}$ " }
                      ].map((sym) => (
                        <button
                          type="button"
                          key={sym.label}
                          onClick={() =>
                            setNewQForm((prev) => ({ ...prev, question: prev.question + sym.code }))
                          }
                          className="px-2.5 py-1 rounded-xl bg-slate-950/70 hover:bg-slate-800 border border-slate-700 text-xs font-mono"
                        >
                          {sym.label}
                        </button>
                      ))}
                    </div>

                    <textarea
                      rows={3}
                      value={newQForm.question}
                      onChange={(e) => setNewQForm((prev) => ({ ...prev, question: e.target.value }))}
                      placeholder="Nhập nội dung câu hỏi (dùng $...$ cho công thức)..."
                      className="w-full rounded-2xl bg-slate-950/75 text-slate-100 border border-slate-700 p-3 text-xs"
                    />

                    {/* Khung Xem trước công thức (Live KaTeX Preview) */}
                    <div className="p-3.5 rounded-2xl bg-slate-950/60 border border-emerald-500/30 space-y-1">
                      <div className="text-[11px] font-bold text-emerald-400">
                        👁️ Xem trước công thức trực tiếp (Live KaTeX Preview):
                      </div>
                      <div className="text-sm">
                        <MathChemText content={newQForm.question} />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      {["optionA", "optionB", "optionC", "optionD"].map((key, i) => (
                        <input
                          key={key}
                          type="text"
                          value={newQForm[key]}
                          onChange={(e) => setNewQForm((prev) => ({ ...prev, [key]: e.target.value }))}
                          placeholder={`Phương án ${["A", "B", "C", "D"][i]}`}
                          className="px-3 py-2 rounded-xl bg-slate-950/75 text-slate-100 border border-slate-700 text-xs"
                        />
                      ))}
                    </div>

                    <button
                      type="submit"
                      className={`w-full py-3 rounded-2xl font-extrabold text-xs shadow-lg ${currentTheme.accentBg}`}
                    >
                      + Lưu Câu Hỏi Vào Ngân Hàng Đề
                    </button>
                  </form>
                </div>
              )}

              {/* ================================================================
                  PHÂN KHU 7: TIẾN ĐỘ, BIỂU ĐỒ RADAR 6 TRỤC & BẢNG XẾP HẠNG
                 ================================================================ */}
              {activeTab === "analytics" && (
                <div className="space-y-6">
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    {/* Biểu đồ SVG Radar 6 trục */}
                    <div className={`rounded-3xl border p-6 space-y-4 ${currentTheme.panel}`}>
                      <div className="flex items-center justify-between">
                        <div>
                          <h3 className="font-extrabold text-base">
                            Biểu đồ SVG Radar 6 Trục ({activeSubject === "chemistry" ? "Môn Hóa Học" : "Môn Toán Học"})
                          </h3>
                          <p className="text-xs opacity-75">
                            Phân tích đa chiều mức độ làm chủ 6 chuyên đề cốt lõi
                          </p>
                        </div>
                      </div>
                      <RadarChartSVG axes={radarAxesData} accentColor={currentTheme.hex} />
                    </div>

                    {/* Biểu đồ SVG Area Chart tiến bộ điểm số */}
                    <div className={`rounded-3xl border p-6 space-y-4 ${currentTheme.panel}`}>
                      <div>
                        <h3 className="font-extrabold text-base">
                          Biểu đồ Tiến Độ Điểm Số Qua Các Lần Thi (SVG Area Chart)
                        </h3>
                        <p className="text-xs opacity-75">
                          Theo dõi sự tiến bộ điểm số hệ 10 theo thời gian thực
                        </p>
                      </div>
                      <AreaChartSVG history={quizHistory} accentColor={currentTheme.hex} />
                    </div>
                  </div>

                  {/* Bảng Xếp Hạng (Realtime Leaderboard) */}
                  <div className={`rounded-3xl border p-6 space-y-4 ${currentTheme.panel}`}>
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <h3 className="font-extrabold text-base flex items-center gap-2">
                        <i className="fa-solid fa-trophy text-amber-400"></i>
                        <span>Bảng Xếp Hạng Đua Top KHTN (Top XP • Top Streak • Top Rank)</span>
                      </h3>
                      <span className="text-xs opacity-75">Đồng bộ Realtime</span>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs md:text-sm border-collapse">
                        <thead>
                          <tr className="border-b border-slate-800 opacity-75">
                            <th className="py-3 px-3">Hạng</th>
                            <th className="py-3 px-3">Học sinh</th>
                            <th className="py-3 px-3">Danh hiệu Rank</th>
                            <th className="py-3 px-3">Chuỗi Streak</th>
                            <th className="py-3 px-3">Tổng XP</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {[
                            {
                              name: `${userProfile.name} (Bạn)`,
                              rank: userProfile.rankTitle,
                              streak: userProfile.streak,
                              xp: userProfile.xp,
                              highlight: true
                            },
                            {
                              name: "Nguyễn Minh Khôi - Chuyên Hóa",
                              rank: "Bậc Thầy Phân Tử",
                              streak: 19,
                              xp: 2790,
                              highlight: false
                            },
                            {
                              name: "Trần Bảo Ngọc - Đội tuyển Toán",
                              rank: "Kiến Trúc Sư Giải Tích",
                              streak: 15,
                              xp: 2640,
                              highlight: false
                            },
                            {
                              name: "Lê Hoàng Nam - KHTN",
                              rank: "Chiến Binh Lượng Tử",
                              streak: 11,
                              xp: 2410,
                              highlight: false
                            }
                          ]
                            .sort((a, b) => b.xp - a.xp)
                            .map((row, index) => (
                              <tr
                                key={row.name}
                                className={row.highlight ? "bg-emerald-500/15 font-bold" : ""}
                              >
                                <td className="py-3 px-3 font-extrabold text-amber-400">#{index + 1}</td>
                                <td className="py-3 px-3">{row.name}</td>
                                <td className="py-3 px-3">{row.rank}</td>
                                <td className="py-3 px-3 text-amber-300">🔥 {row.streak} ngày</td>
                                <td className={`py-3 px-3 font-bold ${currentTheme.accentText}`}>
                                  ⚡ {row.xp} XP
                                </td>
                              </tr>
                            ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}
            </main>

            {/* THANH ĐIỀU HƯỚNG ĐÁY KÍNH MỜ CHO ĐIỆN THOẠI (FIXED BOTTOM GLASS NAVIGATION BAR) */}
            {!isZenMode && (
              <nav
                className={`${
                  isForcedMobile ? "flex" : "flex md:hidden"
                } fixed bottom-0 left-0 right-0 z-40 border-t ${currentTheme.panel} px-1 py-1.5 pb-[env(safe-area-inset-bottom)] justify-around items-center`}
              >
                {NAV_ITEMS.map((item) => {
                  const active = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl text-[10px] font-bold transition-all ${
                        active ? currentTheme.accentText : "opacity-65"
                      }`}
                    >
                      <i className={`fa-solid ${item.icon} text-sm mb-0.5`}></i>
                      <span className="truncate max-w-[54px]">{item.short}</span>
                    </button>
                  );
                })}
              </nav>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
